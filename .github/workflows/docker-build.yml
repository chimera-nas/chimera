name: Build Docker Image

on:
  push:
    branches:
      - main          # publish from the default branch
    tags:
      - "*"           # publish when any tag is pushed
  # No pull_request trigger: the PR-time "Docker build complete" placeholder
  # lives in pr-checks.yml, so PRs don't show a skipped docker-build job.
  merge_group:         # build to gate the merge queue (no publish) but don’t publish
  workflow_dispatch:   # allow manual runs

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # The mirrored ccache binary comes from its public GHCR package, which is
  # already the Dockerfile's default; nothing here has to name it.

jobs:
  build-and-push:
    name: Build ${{ matrix.os }} ${{ matrix.platform }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 24.04 builds
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            os: ubuntu24.04
            dockerfile: Dockerfile
            tag: latest-amd64
            publish: true
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Debug
            os: ubuntu24.04
            dockerfile: Dockerfile
            tag: latest-debug-amd64
            publish: true
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Release
            os: ubuntu24.04
            dockerfile: Dockerfile
            tag: latest-arm64
            publish: true
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Debug
            os: ubuntu24.04
            dockerfile: Dockerfile
            tag: latest-debug-arm64
            publish: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # Unconditional, where it used to be push-only: the layer cache below
      # lives in GHCR now, and a merge_group run that never publishes still has
      # to authenticate to read it.
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.tag }}

      - name: Build the docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name == 'push' && matrix.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=ghcr.io/chimera-nas/chimera-build-cache:${{ matrix.os }}-${{ matrix.arch }}
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref=ghcr.io/chimera-nas/chimera-build-cache:{0}-{1},mode=max', matrix.os, matrix.arch) || '' }}
          build-args: |
            BUILD_TYPE=${{ matrix.build_type }}

  merge-manifests:
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

          # Create multi-arch manifests for Ubuntu 24.04 images
          docker buildx imagetools create -t ${IMAGE}:latest \
              ${IMAGE}:latest-amd64 \
              ${IMAGE}:latest-arm64
          docker buildx imagetools create -t ${IMAGE}:latest-debug \
              ${IMAGE}:latest-debug-amd64 \
              ${IMAGE}:latest-debug-arm64

  # Single stable aggregate of the docker image builds, for the merge queue's
  # required-checks list. Mark this job as a required status check.
  docker-build-complete:
    name: Docker build complete
    needs: build-and-push
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify docker build jobs passed
        run: |
          # Every dependency must be `success`.  Checking results rather than
          # using success() means a job that was skipped -- never actually run --
          # cannot pass this for the wrong reason.
          results='${{ join(needs.*.result, ' ') }}'
          echo "dependency results: ${results}"
          for r in ${results}; do
            if [ "$r" != "success" ]; then
              echo "a required job did not succeed"
              exit 1
            fi
          done
