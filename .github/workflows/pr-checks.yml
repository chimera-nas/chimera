name: PR checks

# The heavy build/test matrix (build-test.yml) and docker image builds
# (docker-build.yml) run ONLY in the merge queue (merge_group), not on pull
# requests -- so a PR's check list isn't cluttered with a wall of skipped
# matrix jobs.  The branch-protection ruleset requires "CI complete" and
# "Docker build complete" on a PR before it can be added to the queue, and the
# jobs of those names here are what report them at PR time; the real checks of
# the same names run in the queue.
#
# "CI complete" is a real gate, not a placeholder: it depends on every
# pre-merge job below, so a PR cannot enter the queue until all of them are
# green.  It used to be a bare echo, which meant the required set went green in
# about a second and the pre-merge signal -- ten minutes of static analysis and
# model-based tests -- gated nothing at all.  Queueing early simply skipped it.
#
# "Docker build complete" stays a no-op here, because no docker image is built
# at PR time; that check only carries meaning in the queue.
#
# It also carries the pre-merge signal that is cheap enough to be worth having
# before the queue: clang static analysis on devcontainer and macOS, and the
# quint model-based test suite (ctest label "quint") on devcontainer.  The MBT
# suites are the fastest broad-coverage tests in the tree -- the whole label
# runs in well under a minute -- and they are the ones a spec or harness change
# breaks, so catching that here rather than in the queue is worth one image
# build.  macOS runs the quint suite post-merge, in build-test.yml's macOS job,
# rather than twice.
#
# The queue now runs this same pair -- quick-tier ctest and static analysis --
# across every supported OS, so what this job buys is earliness, not extra
# coverage.
on:
  pull_request:

# A re-push (including an amend/force-push) is a `synchronize` event, so it
# starts a fresh run.  Cancel the one it supersedes: without this both would run
# to completion and race to update the same sticky comment, and the loser could
# be the older run -- leaving a report that describes commits that are no longer
# on the branch.  The reports themselves are keyed by marker and updated in
# place, so a rerun replaces its comment rather than stacking a second one.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Unlike the merge queue, this workflow builds the devcontainer image inside
  # each job that needs it and loads it into that runner's docker daemon; it
  # never pushes.  This is the one workflow reachable from a fork, and a fork's
  # pull_request run gets a read-only GITHUB_TOKEN that cannot write a package
  # -- so a build-once-push-once shape would leave the pre-merge signal broken
  # for exactly the contributors it exists to serve.  There are only two
  # consumers here, so building twice costs less than the alternative.
  #
  # Only the layer cache crosses the network, and only to be read: the merge
  # queue owns that tag and a PR must not be able to poison it.  With an
  # unchanged Dockerfile the "build" is a layer pull.
  DEV_IMAGE: chimera-dev:${{ github.sha }}
  DEV_IMAGE_CACHE: ghcr.io/chimera-nas/chimera-dev:buildcache-amd64
  # The mirrored ccache binary and the quint toolchain come from their public
  # GHCR packages, which are the Dockerfiles' own defaults; nothing here has to
  # name them.
  CCACHE_MAXSIZE: 2G

jobs:
  ci-complete:
    name: CI complete
    needs: [analyze-dev, quint-coverage, analyze-macos]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Verify every pre-merge job succeeded
        run: |
          # Every dependency must be `success`.  Checking results rather than
          # using success() means a job that was skipped -- never actually run --
          # cannot pass this for the wrong reason.
          results='${{ join(needs.*.result, ' ') }}'
          echo "dependency results: ${results}"
          for r in ${results}; do
            if [ "$r" != "success" ]; then
              echo "a required job did not succeed"
              exit 1
            fi
          done

  docker-build-complete:
    name: Docker build complete
    runs-on: ubuntu-24.04
    steps:
      - name: PR placeholder
        run: echo "No docker image is built at PR time; the real check runs in the merge queue."

  # ---------------------------------------------------------------------------
  # Pre-merge signal.  Both jobs below build the devcontainer image for
  # themselves -- see the DEV_IMAGE comment in env -- and then mirror the merge
  # queue's {static-analysis, test-dev} pair.
  # ---------------------------------------------------------------------------
  analyze-dev:
    name: Analyze devcontainer amd64 Release (pre-merge)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      # The layer cache is a GHCR package of this repository.  Authenticating
      # with the run's own token means the import works whether or not the
      # package has been made public; a fork's pull_request token is read-only,
      # which is all an import needs.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # load, not push, and cache-from without cache-to: nothing this run
      # produces leaves the runner, and the merge queue keeps sole ownership of
      # the cache tag.
      - name: Build the dev container image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.DEV_IMAGE }}
          cache-from: type=registry,ref=${{ env.DEV_IMAGE_CACHE }}
          build-args: |
            UBUNTU_MIRROR=azure

      # Unlike the store this replaced, the Actions cache is readable from a
      # fork's pull_request run -- a run may read its own ref's scope and the
      # default branch's.  extended.yml writes that scope on main, so this is a
      # warm cache on every PR rather than one only same-repo PRs could reach.
      - name: Restore the ccache directory
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-analyze-devcontainer-amd64-Release-${{ github.sha }}
          restore-keys: |
            ccache-analyze-devcontainer-amd64-Release-

      - name: Run the clang static analyzer
        id: static-analysis
        run: |
          set -o pipefail
          mkdir -p "${{ github.workspace }}/scan-report"
          docker run --rm --privileged \
            -e CCACHE_DIR=/ccache \
            -e CCACHE_MAXSIZE \
            -v "${{ runner.temp }}/ccache:/ccache" \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/scan-report:/scan-report" \
            -v /build \
            -w /build \
            ${{ env.DEV_IMAGE }} \
            bash -euxc '
              # Zero the counters the restored cache brought with it, so
              # --show-stats below describes this run rather than this run plus
              # the Extended run that produced the cache.
              ccache -z > /dev/null
              cmake -D CMAKE_BUILD_TYPE=Release -D CMAKE_C_COMPILER=clang -D CMAKE_EXPORT_COMPILE_COMMANDS=ON -D IO_URING_NVME_ENABLED=OFF -D SPECS_BUNDLE=NONE -B /build -S /workspace -G Ninja
              ninja -C /build
              python3 /workspace/scripts/analyze_cached.py \
                      --build-dir /build --report-dir /scan-report \
                      --exclude /workspace/ext/ -j "$(nproc)"
              ccache --show-stats || true' \
            2>&1 | tee "${{ github.workspace }}/scan-report/analyzer-output.txt"

      - name: Upload static analysis report
        if: ${{ failure() && steps.static-analysis.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: scan-report-pr-devcontainer-amd64-Release
          path: scan-report/
          if-no-files-found: warn
          retention-days: 30

  quint-coverage:
    name: Quint coverage devcontainer amd64
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          # A pull_request checkout is the refs/pull/N/merge commit, whose
          # first parent is the merge base -- so `git diff HEAD^1 HEAD` is
          # exactly this PR's diff, and depth 2 is all it takes to have it.
          # The default depth 1 has no parent at all.
          fetch-depth: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      # The layer cache is a GHCR package of this repository.  Authenticating
      # with the run's own token means the import works whether or not the
      # package has been made public; a fork's pull_request token is read-only,
      # which is all an import needs.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the dev container image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.DEV_IMAGE }}
          cache-from: type=registry,ref=${{ env.DEV_IMAGE_CACHE }}
          build-args: |
            UBUNTU_MIRROR=azure

      # Captured on the runner rather than in the container below: the
      # bind-mounted checkout is not owned by the container's root, so git
      # there refuses the repository as dubiously owned (the same trap
      # cmake/SpecsBundle.cmake documents).  -U0 keeps hunk headers to exactly
      # the changed runs, with no context lines to subtract back out.
      - name: Capture the pull request diff
        if: ${{ github.event_name == 'pull_request' }}
        run: git diff -U0 HEAD^1 HEAD > pr.diff

      # oras lets cmake fetch the prebuilt trace bundle for the pinned
      # ext/specs commit instead of regenerating it with quint; the image
      # carries quint either way, so this is a speedup, not a requirement.
      - name: Fetch oras CLI
        uses: ./.github/actions/fetch-oras
        with:
          arch: amd64

      # A Coverage build (clang source-based instrumentation, -O0) rather than
      # Debug: the suite still reports pass/fail, and the same run answers the
      # question this job exists for -- how much of chimera the models actually
      # reach.  ASan coverage of these suites comes from the merge queue's Debug
      # jobs, which now have a trace corpus too.
      #
      # --no-tests=error is the point of the label: a configuration that
      # silently loses its MBT suites (no quint, no bundle) must fail here
      # rather than report a vacuous pass.  It only catches losing the label
      # ENTIRELY, though, so REQUIRE_CTL_MBT=ON covers the narrower case of
      # the in-tree control-plane corpus alone going missing.
      - name: Build instrumented and run the quint suite
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_REPO: ${{ github.repository }}
          # The PR head, not the merge commit: a link to a merge ref's blob
          # dies with the ref.  Empty on a non-PR run, which only costs the
          # uncovered lines their hyperlinks.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm --privileged \
            -e RUN_URL="$RUN_URL" \
            -e GH_REPO="$GH_REPO" \
            -e PR_HEAD_SHA="$PR_HEAD_SHA" \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/oras:/usr/local/bin/oras:ro" \
            -v /build \
            -w /build \
            ${{ env.DEV_IMAGE }} \
            bash -euxc '
              # Ubuntu ships these versioned; the unversioned names are not
              # always on PATH, and coverage-report.sh honours the overrides.
              export LLVM_PROFDATA="$(command -v llvm-profdata || ls /usr/lib/llvm-*/bin/llvm-profdata | tail -n1)"
              export LLVM_COV="$(command -v llvm-cov || ls /usr/lib/llvm-*/bin/llvm-cov | tail -n1)"
              cmake -G Ninja -DCMAKE_BUILD_TYPE=Coverage -DCMAKE_C_COMPILER=clang \
                    -DKVM_TESTING=OFF -DREQUIRE_CTL_MBT=ON /workspace
              ninja
              mkdir -p /build/coverage/profraw
              LLVM_PROFILE_FILE=/build/coverage/profraw/%m-%p.profraw \
                ctest -L quint --output-on-failure --no-tests=error \
                      --test-output-size-failed 65536 --timeout 600 -j "$(nproc)"
              # Which of the changed files are worth an lcov export; empty
              # (or absent, on a non-PR run) means the export is skipped.
              : > /workspace/pr-sources.txt
              if [ -f /workspace/pr.diff ]; then
                python3 /workspace/scripts/ci_patch_coverage.py \
                        --sources /workspace/pr.diff \
                        > /workspace/pr-sources.txt
              fi
              COVERAGE_JSON=/workspace/coverage-export.json \
              COVERAGE_LCOV=/workspace/patch-coverage.lcov \
              COVERAGE_LCOV_SOURCES=/workspace/pr-sources.txt \
                bash /workspace/etc/coverage-report.sh /build
              # Rendered in here, where the paths in the export still resolve.
              python3 /workspace/scripts/ci_coverage_report.py \
                      /workspace/coverage-export.json /workspace "$RUN_URL" \
                      > /workspace/coverage-report.md
              if [ -f /workspace/pr.diff ]; then
                python3 /workspace/scripts/ci_patch_coverage.py \
                        /workspace/pr.diff /workspace/patch-coverage.lcov \
                        /workspace "$GH_REPO" "$PR_HEAD_SHA" \
                        >> /workspace/coverage-report.md
              fi'

      # Best-effort: a report that cannot be posted is still in the run summary,
      # and a comment API hiccup should not fail an otherwise-green job.
      - name: Publish the coverage report
        if: ${{ always() && hashFiles('coverage-report.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_COMMENT_MARKER: "<!-- quint-coverage-report -->"
        run: |
          cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"
          # Carried in the artifact for pr-coverage-comment.yml: a workflow_run
          # event has an empty `pull_requests` for a fork PR, so the number has
          # to travel with the report rather than be looked up there.
          printf '%s\n' "${PR_NUMBER:-}" > pr-number.txt
          # A fork PR's token is read-only however the permissions block is
          # written, so this call fails there by design; the relay posts it
          # instead.  On a same-repo PR it lands immediately, and the relay's
          # later update is a no-op PATCH of the same marker.
          if [ -n "${PR_NUMBER:-}" ]; then
            python3 scripts/ci_pr_comment.py "$GH_REPO" "$PR_NUMBER" coverage-report.md \
              || echo "::warning::could not post the coverage comment directly (expected on a fork PR; pr-coverage-comment.yml relays it)"
          fi

      - name: Upload the coverage export and report
        if: ${{ always() && hashFiles('coverage-export.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: quint-coverage
          path: |
            coverage-export.json
            coverage-report.md
            pr-number.txt
          if-no-files-found: warn
          retention-days: 30

  analyze-macos:
    name: Analyze macOS Release (pre-merge)
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        env:
          CCACHE_REF: ghcr.io/chimera-nas/ccache:4.14-darwin
        run: |
          brew update
          # No llvm: it was only ever here to supply the scan-build driver, and
          # driving `clang --analyze` directly does not need it.  Dropping it
          # also keeps this job on Apple's clang -- the compiler ccc-analyzer
          # was always actually compiling with -- which is what the merge queue
          # settled on after pinning brew's LLVM turned a warning it alone emits
          # into a -Werror failure.
          brew install cmake ninja bison jansson userspace-rcu rocksdb krb5 \
                       xxhash libxcrypt uthash openssl@3 libnghttp2 oras
          oras pull "${CCACHE_REF}" --output "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/ccache-darwin" /usr/local/bin/ccache
          ccache --version | head -1

      # Unlike the Linux half of this workflow, this needs no secrets: the
      # Actions cache is available to a fork's pull_request run, and a run can
      # read the default branch's scope.  extended.yml writes that scope on main,
      # so this restores what the scheduled run on main left behind.
      - name: Restore the ccache directory
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-macos-analyze-Release-${{ github.sha }}
          restore-keys: |
            ccache-macos-analyze-Release-

      - name: Run the clang static analyzer
        id: static-analysis
        env:
          # Must match the directory extended.yml builds analyze-macos in.
          # The producer and the consumer of a ccache have to agree on it:
          # generated headers are reached through -I<build-dir>/... paths, which
          # are part of the command line ccache hashes, so building somewhere
          # else misses on every translation unit that includes one -- which is
          # most of them.
          BUILD_DIR: ${{ runner.temp }}/build-analyze
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: 2G
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/scan-report"
          # Zero the counters restored with the cache, so the stats below
          # describe this run and not the Extended run that filled it.
          ccache -z > /dev/null
          cmake -G Ninja -D CMAKE_BUILD_TYPE=Release \
                -D CMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -D SPECS_BUNDLE=NONE \
                -S "$GITHUB_WORKSPACE" -B "$BUILD_DIR"
          # compile_commands.json is not sufficient alone: several entries
          # include generated headers, so the tree has to be built first.
          ninja -C "$BUILD_DIR"
          # --exclude ext: the vendored submodules are analysed in their own
          # repos and cannot be fixed from a chimera PR.
          python3 "$GITHUB_WORKSPACE/scripts/analyze_cached.py" \
                  --build-dir "$BUILD_DIR" \
                  --report-dir "$GITHUB_WORKSPACE/scan-report" \
                  --exclude "$GITHUB_WORKSPACE/ext/" \
                  -j "$(sysctl -n hw.ncpu)" \
            2>&1 | tee "$GITHUB_WORKSPACE/scan-report/analyzer-output.txt"
          ccache --show-stats || true

      - name: Upload static analysis report
        if: ${{ failure() && steps.static-analysis.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: analyzer-report-pr-macos-Release
          path: scan-report/
          if-no-files-found: warn
          retention-days: 30
