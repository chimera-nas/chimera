name: REUSE Compliance Check

on:
  push:
    branches: [ main ]
  pull_request:
  merge_group:         # also gate the merge queue

# The lint pass only reads the tree, so the GITHUB_TOKEN needs nothing
# beyond that.  Without an explicit block a job inherits whatever the
# repository default happens to be.
permissions:
  contents: read

jobs:
  reuse-lint:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
        
    - name: Install reuse tool
      run: |
        pip install --upgrade pip
        pip install 'reuse[charset-normalizer]'
        
    - name: Run REUSE lint
      run: |
        reuse lint

    - name: Check copyright years and commit attribution
      if: github.event_name == 'pull_request'
      env:
        BASE_REF: origin/${{ github.base_ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        bash etc/copyright-year.sh --check --base "$BASE_REF"

        pattern='(^|[^[:alnum:]_])(claude|codex)([^[:alnum:]_]|$)'
        merge_base=$(git merge-base "$BASE_REF" "$HEAD_SHA")
        failed=0

        while read -r commit; do
          if git show -s --format='%an <%ae>%n%B' "$commit" | grep -Eiq "$pattern"; then
            summary=$(git show -s --format='%h %s' "$commit")
            echo "::error title=Invalid commit attribution::$summary names a prohibited automated agent in its author identity or message"
            failed=1
          fi
        done < <(git rev-list "$merge_base..$HEAD_SHA")

        exit "$failed"
