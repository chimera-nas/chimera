name: CI

on:
  # The full build/test matrix runs in the merge queue and again on the commit
  # the queue produced, never on raw PRs; the PR-time half of the gate lives in
  # pr-checks.yml.  There is no pull_request trigger here, so the jobs below
  # carry no event guards: every job in this file runs on every event that
  # reaches it.
  #
  # The push half is what publishes the shared caches.  A cache saved on a
  # merge_group ref is unreadable the moment the queue discards that ref -- of
  # the 131 entries this repo held before the move, 123 (23.6 GB of 25 GB) were
  # stranded exactly that way.  refs/heads/main is the default branch, so a
  # cache saved here is readable from every PR and every queue run, which is
  # the whole point of saving it.
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:   # allow manual runs

# What gates a merge is the QUICK test tier plus static analysis, run on every
# supported OS rather than on a chosen few:
#   - all OS images built for amd64 (devcontainer also for arm64)
#   - quick-tier ctest on every image, and on macOS
#   - static analysis on every image, and on macOS
#
# The extended tier -- pynfs, pjdfstest, cthon, ltp, pike, smbtorture, wpts,
# KVM -- runs in .github/workflows/extended.yml, one job per platform.  It is
# too slow to sit in front of a merge, and the queue is the wrong place to
# discover that a KVM guest image moved.
#
# There is no flaky-test rescue.  A test that fails, fails: no re-run, no
# marker artifact, no review gate.  A retry that turns red into green hides
# exactly the race a merge queue exists to catch, and the rescued-flake path
# was where a real failure could reach main behind an approval click.
#
# The run is two phases, fanned out as wide as possible within each, and the
# job display names follow the phase ("Build X" = container image, "Test X" /
# "Analyze X" = the source tree) so the CI details view reads unambiguously:
#   1. Build   container images              (build-devcontainer, build-<os>)
#   2. Test    compile + ctest, with static  (test, test-dev,
#              analysis running alongside     static-analysis)
#
# Phase 2 has no internal barrier: compile and test are a single job, and the
# analysis starts beside them rather than behind them.  There is exactly one
# test job per compile now, so handing a build tree between two jobs bought
# nothing and cost a tar, a round trip to a shared store, and a second
# checkout -- and
# scan-build does its own instrumented compile, so it never wanted that build
# tree at all.  Everything downstream of the container images starts at once.

env:
  DEV_IMAGE_TAG_PREFIX: ghcr.io/chimera-nas/chimera-dev
  U26_IMAGE_TAG_PREFIX: ghcr.io/chimera-nas/chimera-ubuntu26
  U24_IMAGE_TAG_PREFIX: ghcr.io/chimera-nas/chimera-ubuntu24
  U22_IMAGE_TAG_PREFIX: ghcr.io/chimera-nas/chimera-ubuntu22
  R9_IMAGE_TAG_PREFIX: ghcr.io/chimera-nas/chimera-rocky9
  R10_IMAGE_TAG_PREFIX: ghcr.io/chimera-nas/chimera-rocky10
  # The mirrored ccache binary, the quint toolchain and the KVM guest images now
  # come straight from their public GHCR packages.  Those are the defaults
  # already compiled into the Dockerfiles and into kvm/CMakeLists.txt, so
  # nothing here has to name them: the overrides that used to sit here existed
  # only to route those pulls through an internal proxy, which a GitHub-hosted
  # runner cannot reach.
  #
  # Shared compiler cache.  Every job uses a purely *local* ccache directory,
  # restored before the build from the entry the previous push to main saved for
  # that cell and mounted into the container.  That is the same mechanism the
  # macOS jobs have always used, but the division of labour has moved: this
  # workflow's push-to-main run is the sole writer, and everything else -- the
  # queue runs here, pr-checks.yml, and the whole Extended workflow -- only
  # reads.
  #
  # The writer has to be a ref that other runs can read.  Actions caches are
  # branch-scoped: an entry saved on a merge_group ref dies with that ref, and
  # one saved on a PR merge ref is private to that PR, so neither can serve the
  # next run.  refs/heads/main is the default branch and is readable from
  # everywhere, which is why the save hangs off the push and not the queue.
  #
  # The -v2- in every key is a scheme version, and it is load-bearing.  Writing
  # to a readable ref is necessary but NOT sufficient: a run searches its OWN
  # cache scope before the base branch, so an entry left in refs/pull/N/merge by
  # the previous regime -- when PR and queue runs still saved -- matches the same
  # restore-keys prefix and WINS over the fresh entry on main.  Measured on the
  # first PR run after the switchover: it restored a two-day-old 231 MB PR-scoped
  # cache instead of that morning's main entry and hit 15 of 1754 compiles
  # (0.86%), paying the download in full for nothing.  Versioning the prefix
  # makes those stale entries unmatchable, so the search falls through to main.
  # Bump it again on any change that invalidates the contents; do not reuse a
  # version.
  #
  # Publishing on every merge rather than on a 6-hourly cron also keeps the
  # entries close to the tip.  A PR builds the merge of its branch with current
  # main, so once main moves past what a bundle was built from, every
  # translation unit including a changed header misses: measured on the same
  # macOS analysis job either side of four merges, two touching headers, 100%
  # hits and 113s against 60% and 464s.
  #
  # A miss is a cold build, never a failed job -- which matters more against
  # this store than the last one.  A repository gets 10 GB of Actions cache at
  # no cost and evicts least-recently-used entries to stay inside it; the limit
  # is raisable, but only on a paid plan and as billed storage, so treat 10 GB
  # as the working budget.  Eviction discards by oldest last-access and a
  # restore-keys prefix match wants the newest, so the two agree; losing that
  # race costs a slow job and nothing else.
  CCACHE_MAXSIZE: 2G

jobs:
  build-devcontainer:
    name: Build devcontainer ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the dev container image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.DEV_IMAGE_TAG_PREFIX }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=ghcr.io/chimera-nas/chimera-dev:buildcache-${{ matrix.arch }}
          # cache-to only from the push to main.  This workflow also accepts
          # workflow_dispatch, which can name ANY branch, and anyone with write
          # access -- an outside collaborator included -- can invoke it.  Left
          # ungated, a dispatch on an arbitrary branch would rewrite the shared
          # layer cache that every later build imports.  The push trigger is
          # branch-filtered to main, so the event name alone is the gate.
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref=ghcr.io/chimera-nas/chimera-dev:buildcache-{0},mode=max', matrix.arch) || '' }}
          build-args: |
            UBUNTU_MIRROR=azure

  build-ubuntu26:
    name: Build ubuntu26 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the ubuntu26 CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ubuntu26.04
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.U26_IMAGE_TAG_PREFIX }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=ghcr.io/chimera-nas/chimera-ubuntu26:buildcache-${{ matrix.arch }}
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref=ghcr.io/chimera-nas/chimera-ubuntu26:buildcache-{0},mode=max', matrix.arch) || '' }}
          build-args: |
            UBUNTU_MIRROR=azure

  build-ubuntu24:
    name: Build ubuntu24 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the ubuntu24 CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ubuntu24.04
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.U24_IMAGE_TAG_PREFIX }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=ghcr.io/chimera-nas/chimera-ubuntu24:buildcache-${{ matrix.arch }}
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref=ghcr.io/chimera-nas/chimera-ubuntu24:buildcache-{0},mode=max', matrix.arch) || '' }}
          build-args: |
            UBUNTU_MIRROR=azure

  build-ubuntu22:
    name: Build ubuntu22 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the ubuntu22 CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ubuntu22.04
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.U22_IMAGE_TAG_PREFIX }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=ghcr.io/chimera-nas/chimera-ubuntu22:buildcache-${{ matrix.arch }}
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref=ghcr.io/chimera-nas/chimera-ubuntu22:buildcache-{0},mode=max', matrix.arch) || '' }}
          build-args: |
            UBUNTU_MIRROR=azure

  build-rocky9:
    name: Build rocky9 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the rocky9 CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.rocky9
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.R9_IMAGE_TAG_PREFIX }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=ghcr.io/chimera-nas/chimera-rocky9:buildcache-${{ matrix.arch }}
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref=ghcr.io/chimera-nas/chimera-rocky9:buildcache-{0},mode=max', matrix.arch) || '' }}
          build-args: |
            UBUNTU_MIRROR=azure

  build-rocky10:
    name: Build rocky10 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the rocky10 CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.rocky10
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.R10_IMAGE_TAG_PREFIX }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=ghcr.io/chimera-nas/chimera-rocky10:buildcache-${{ matrix.arch }}
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref=ghcr.io/chimera-nas/chimera-rocky10:buildcache-{0},mode=max', matrix.arch) || '' }}
          build-args: |
            UBUNTU_MIRROR=azure

  # Distro compile + test: configure, build, and run this image's quick-tier
  # ctest, all in one container.  needs is the container images alone -- there
  # is no compile barrier, so a cell starts the moment its image exists and
  # its tests are not held back by the slowest compile in the matrix.
  test:
    name: Test ${{ matrix.image_name }} ${{ matrix.arch }} ${{ matrix.build_type }}
    needs: [build-ubuntu26, build-ubuntu24, build-ubuntu22, build-rocky9, build-rocky10]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # NOTE: the devcontainer has its own test-dev job below -- it is the
          # one image built for both arches, and it configures KVM on; it is
          # not part of this distro matrix.
          # ubuntu 26 (amd64 only on PR; arm64 runs in the extended workflow)
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu26
            image_name: ubuntu26
            cmake_extra: "-DKVM_TESTING=OFF"
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu26
            image_name: ubuntu26
            cmake_extra: "-DKVM_TESTING=OFF"
          # ubuntu 24 (amd64 only on PR; arm64 runs in the extended workflow)
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu24
            image_name: ubuntu24
            cmake_extra: "-DKVM_TESTING=OFF"
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu24
            image_name: ubuntu24
            cmake_extra: "-DKVM_TESTING=OFF"
          # ubuntu 22 (amd64 only on PR; arm64 runs in the extended workflow)
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu22
            image_name: ubuntu22
            cmake_extra: "-DIO_URING_ENABLED=OFF -DKVM_TESTING=OFF"
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu22
            image_name: ubuntu22
            cmake_extra: "-DIO_URING_ENABLED=OFF -DKVM_TESTING=OFF"
          # rocky 9 (io_uring disabled: kernel 5.14 + ASAN causes timeouts, see #197)
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky9
            image_name: rocky9
            cmake_extra: "-DIO_URING_ENABLED=OFF -DKVM_TESTING=OFF"
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky9
            image_name: rocky9
            cmake_extra: "-DIO_URING_ENABLED=OFF -DKVM_TESTING=OFF"
          # rocky 10 (amd64 only on PR; arm64 runs in the extended workflow)
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky10
            image_name: rocky10
            cmake_extra: "-DKVM_TESTING=OFF"
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky10
            image_name: rocky10
            cmake_extra: "-DKVM_TESTING=OFF"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # A hosted runner has far less disk than the ARC hosts this used to run
      # on, and these images are large; see the action for what it reclaims.
      # The CI images are GHCR packages of this repository, so the pull below
      # is authenticated with the run's own token.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # KVM guest images are pulled from GHCR (chimera-nas/kvm-test-base) with
      # oras at configure time, instead of being built via inner dind.  Fetch
      # the static oras binary on the runner and mount it into the container.
      - name: Fetch oras CLI
        uses: ./.github/actions/fetch-oras
        with:
          arch: ${{ matrix.arch }}

      # Restored but never saved.  Actions caches are branch-scoped, and this
      # workflow only ever runs on merge_group, whose gh-readonly-queue ref is
      # discarded -- so anything saved here could never be read back.  The entry
      # that matters is the one extended.yml writes on main, which every run can
      # read.  A miss is a cold build, never a failed job.
      - name: Restore the ccache directory
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v2-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}-

      - name: Configure, build, and test inside the container
        run: |
          # EVPL_IO_URING_ENTRIES below sizes the io_uring rings to a test
          # rather than to a server.  The 8192-entry default costs ~1.5 MB of
          # kernel-accounted memory per ring (SQE128/CQE32 double both entry
          # sizes) and SQPOLL adds a kernel thread each; ctest -j nproc stacks
          # enough of them to be refused with ENOMEM, which is fatal to the
          # process and takes an unrelated test with it.
          docker run --rm --privileged \
            -e CCACHE_DIR=/ccache \
            -e EVPL_IO_URING_ENTRIES=1024 \
            -e CCACHE_MAXSIZE \
            -v "${{ runner.temp }}/ccache:/ccache" \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/oras:/usr/local/bin/oras:ro" \
            -v /build \
            -w /build \
            ${{ matrix.image_tag_prefix }}:${{ github.sha }}-${{ matrix.arch }} \
            bash -euxc '
              mkdir -p /workspace/ctest-results
              # ccache keeps its counters inside the cache directory, so a
              # restored cache carries the statistics of the run that made it.
              # Left alone, --show-stats reports both runs summed: the first
              # consumer read showed "945/1894 (49.89%)" for a build that was
              # really 945 of 947, 99.8%.  Zero them so the number means what it
              # looks like it means.
              ccache -z > /dev/null
              cmake -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DREQUIRE_NETNS_TESTS=ON -DPYNFS_JUNIT_DIR=/workspace/ctest-results/pynfs-junit -DSMBTORTURE_JUNIT_DIR=/workspace/ctest-results/smbtorture-junit -DWPTS_JUNIT_DIR=/workspace/ctest-results/wpts-junit -DPIKE_JUNIT_DIR=/workspace/ctest-results/pike-junit ${{ matrix.cmake_extra }} /workspace
              ninja
              ccache --show-stats || true
              # Trim to the configured ceiling before the save, so the entry
              # the other workflows restore stays a predictable size.
              ccache --trim-max-size ${CCACHE_MAXSIZE} || true
              start=$(date +%s)
              rc=0
              /workspace/scripts/cap_ctest_output.sh ctest --output-on-failure --test-output-size-failed 65536 --timeout 300 -j "$(nproc)" --output-junit /workspace/ctest-results/results.xml || rc=$?
              echo "$(( $(date +%s) - start ))" > /workspace/ctest-results/duration_seconds
              exit $rc'

      # Per-test results for the report: ctest --output-junit (one <testcase>
      # per CTest test) + the pynfs per-code JUnit (the combined pynfs runs are a
      # single CTest test, so their ~500 codes only show up in their own JUnit) +
      # the ctest wall-clock.  if: always() so results publish even when the test
      # step failed (which is exactly when they are most useful).
      # The container runs as root, so everything it wrote into the bind-mounted
      # cache is root-owned and the runner user cannot tar it up.
      - name: Take ownership of the ccache directory
        if: always() && github.event_name == 'push'
        run: sudo chown -R "$(id -u):$(id -g)" "${{ runner.temp }}/ccache"

      # Saved even when the job failed: the cache reflects a build that
      # happened, and withholding it would make every later run pay for a
      # failure that has nothing to do with compilation.  This is why restore
      # and save are split -- actions/cache saves only on a successful job.
      - name: Save the ccache directory
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v2-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}-${{ github.sha }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ctest-junit-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}
          path: ctest-results/
          if-no-files-found: warn
          retention-days: 30

  # Static analysis, running alongside the tests from the moment the container
  # images exist rather than behind them.  A finding never blocks a test from
  # starting; it still gates ci-complete.
  #
  # This drives the analyzer directly rather than through scan-build, because
  # scan-build cannot be cached.  It sets CC to ccc-analyzer, which compiles the
  # TU *and*, as a side effect, writes a report into a directory named by an
  # environment variable.  ccache caches the object and the stderr and knows
  # nothing about that side effect, so a hit replays a compile that looks
  # identical while producing no report -- and --status-bugs then sees a clean
  # run.  Verified: identical source goes from "1 bug found" to "No bugs found"
  # on a warm cache, warning text still printed.  So scan-build has to run with
  # ccache off, which meant a full cold build of the tree in all 14 cells --
  # and these were the 13 slowest jobs in the queue.
  #
  # `clang --analyze -o report.plist` makes the report the primary output, which
  # is exactly what ccache already knows how to cache: a hit restores the plist
  # with its findings intact, and a real source change invalidates it.  Findings
  # were checked against scan-build on a sample covering leak, use-after-free,
  # null deref and divide-by-zero: identical set, identical locations.
  static-analysis:
    name: Analyze ${{ matrix.image_name }} ${{ matrix.arch }} ${{ matrix.build_type }}
    needs: [build-devcontainer, build-ubuntu26, build-ubuntu24, build-ubuntu22, build-rocky9, build-rocky10]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every supported OS image.  The distro images are built amd64-only
          # here (see the test job); the devcontainer is the one built for both
          # arches, so it is the only one analysed on arm64 too.
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-dev
            image_name: devcontainer
            cmake_extra: ""
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-dev
            image_name: devcontainer
            cmake_extra: ""
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu26
            image_name: ubuntu26
            cmake_extra: ""
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu24
            image_name: ubuntu24
            cmake_extra: ""
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu22
            image_name: ubuntu22
            cmake_extra: "-DIO_URING_ENABLED=OFF"
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky9
            image_name: rocky9
            cmake_extra: "-DIO_URING_ENABLED=OFF"
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky10
            image_name: rocky10
            cmake_extra: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # A hosted runner has far less disk than the ARC hosts this used to run
      # on, and these images are large; see the action for what it reclaims.
      # The CI images are GHCR packages of this repository, so the pull below
      # is authenticated with the run's own token.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Restored but never saved.  Actions caches are branch-scoped, and this
      # workflow only ever runs on merge_group, whose gh-readonly-queue ref is
      # discarded -- so anything saved here could never be read back.  The entry
      # that matters is the one extended.yml writes on main, which every run can
      # read.  A miss is a cold build, never a failed job.
      - name: Restore the ccache directory
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v2-analyze-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-analyze-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}-

      - name: Run the clang static analyzer
        id: static-analysis
        run: |
          set -o pipefail
          mkdir -p "${{ github.workspace }}/scan-report"
          docker run --rm --privileged \
            -e CCACHE_DIR=/ccache \
            -e CCACHE_MAXSIZE \
            -v "${{ runner.temp }}/ccache:/ccache" \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/scan-report:/scan-report" \
            -v /build \
            -w /build \
            ${{ matrix.image_tag_prefix }}:${{ github.sha }}-${{ matrix.arch }} \
            bash -euxc '
              # ccache keeps its counters inside the cache directory, so a
              # restored cache carries the statistics of the run that made it.
              # Left alone, --show-stats reports both runs summed: the first
              # consumer read showed "945/1894 (49.89%)" for a build that was
              # really 945 of 947, 99.8%.  Zero them so the number means what it
              # looks like it means.
              ccache -z > /dev/null
              cmake -D CMAKE_BUILD_TYPE=${{ matrix.build_type }} -D CMAKE_C_COMPILER=clang -D CMAKE_EXPORT_COMPILE_COMMANDS=ON -D IO_URING_NVME_ENABLED=OFF -D SPECS_BUNDLE=NONE ${{ matrix.cmake_extra }} -B /build -S /workspace -G Ninja
              # The analyzer reads compile_commands.json, and several entries
              # include generated headers (xdrzcc, ndrzcc, flex, bison), so the
              # tree has to be built before it can run.  Against a primed cache
              # that is close to free.
              ninja -C /build
              python3 /workspace/scripts/analyze_cached.py \
                      --build-dir /build --report-dir /scan-report \
                      --exclude /workspace/ext/ -j "$(nproc)"
              ccache --show-stats || true
              # Trimmed AFTER the analyzer, not between the build and it.  The
              # entries that cost anything to recompute are the --analyze ones,
              # and they do not exist yet at that point: an early trim once
              # published a cache holding only the compile entries, and the
              # first consumer of it hit on every compile and missed on all 838
              # analyses.  || true because the trim is best-effort.
              ccache --trim-max-size ${CCACHE_MAXSIZE} || true' \
            2>&1 | tee "${{ github.workspace }}/scan-report/analyzer-output.txt"

      # The container runs as root, so everything it wrote into the bind-mounted
      # cache is root-owned and the runner user cannot tar it up.
      - name: Take ownership of the ccache directory
        if: always() && github.event_name == 'push'
        run: sudo chown -R "$(id -u):$(id -g)" "${{ runner.temp }}/ccache"

      # Saved even when the job failed: the cache reflects a build that
      # happened, and withholding it would make every later run pay for a
      # failure that has nothing to do with compilation.  This is why restore
      # and save are split -- actions/cache saves only on a successful job.
      - name: Save the ccache directory
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v2-analyze-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}-${{ github.sha }}

      - name: Upload static analysis report
        if: ${{ failure() && steps.static-analysis.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: analyzer-report-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}
          path: scan-report/
          if-no-files-found: warn
          retention-days: 30

  # Aggregate every test job's results into one report -- a per-run table (wall
  # clock + summed test time + pass/fail counts) plus every failed test named --
  # so a PR shows what broke without digging through the ~12k-line log of each
  # matrix job.  Runs after the whole matrix (always, so a failing run still
  # reports) and never fails the build: the test jobs stay the source of truth.
  publish-test-results:
    name: Report
    needs: [test, test-dev, macos]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download test-result artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: ctest-junit-*
          path: results

      # Render the report into the run summary (always) and, on a PR, into a
      # single sticky PR comment.  Pure-Python + stdlib urllib -- no external
      # action and no `gh` CLI (the self-hosted runners have neither).
      - name: Render and publish report
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/ci_test_report.py results > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          # The summary above is the primary output; the PR comment is
          # best-effort (don't fail the job if the API call hiccups).
          if [ -n "${PR_NUMBER:-}" ]; then
            python3 scripts/ci_pr_comment.py "$GH_REPO" "$PR_NUMBER" report.md \
              || echo "::warning::failed to post PR comment (report is in the run summary)"
          fi

  # Devcontainer compile + test: the same one-container shape as the distro
  # `test` job above, on the one image built for both arches.
  #
  # KVM guest images are not fetched (KVM_FETCH_IMAGES=OFF): the KVM suites are
  # extended-tier and run in the extended workflow, so the queue wants the KVM CMake path
  # configured but not the multi-gigabyte guest images behind it.  KVM is
  # x86-only in the devcontainer, so arm64 configures with it off entirely.
  test-dev:
    name: Test devcontainer ${{ matrix.arch }} ${{ matrix.build_type }}
    needs: [build-devcontainer]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04, build_type: Release, kvm_cmake: "-DKVM_TESTING=ON -DKVM_FETCH_IMAGES=OFF" }
          - { arch: amd64, runner: ubuntu-24.04, build_type: Debug,   kvm_cmake: "-DKVM_TESTING=ON -DKVM_FETCH_IMAGES=OFF" }
          - { arch: arm64, runner: ubuntu-24.04-arm, build_type: Release, kvm_cmake: "-DKVM_TESTING=OFF" }
          - { arch: arm64, runner: ubuntu-24.04-arm, build_type: Debug,   kvm_cmake: "-DKVM_TESTING=OFF" }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # A hosted runner has far less disk than the ARC hosts this used to run
      # on, and these images are large; see the action for what it reclaims.
      # The CI images are GHCR packages of this repository, so the pull below
      # is authenticated with the run's own token.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # oras is needed at configure time: KVM_TESTING=ON probes for it.
      - name: Fetch oras CLI
        uses: ./.github/actions/fetch-oras
        with:
          arch: ${{ matrix.arch }}

      # Restored but never saved.  Actions caches are branch-scoped, and this
      # workflow only ever runs on merge_group, whose gh-readonly-queue ref is
      # discarded -- so anything saved here could never be read back.  The entry
      # that matters is the one extended.yml writes on main, which every run can
      # read.  A miss is a cold build, never a failed job.
      - name: Restore the ccache directory
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v2-devcontainer-${{ matrix.arch }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-devcontainer-${{ matrix.arch }}-${{ matrix.build_type }}-

      - name: Configure, build, and test inside the container
        run: |
          # EVPL_IO_URING_ENTRIES below sizes the io_uring rings to a test
          # rather than to a server.  The 8192-entry default costs ~1.5 MB of
          # kernel-accounted memory per ring (SQE128/CQE32 double both entry
          # sizes) and SQPOLL adds a kernel thread each; ctest -j nproc stacks
          # enough of them to be refused with ENOMEM, which is fatal to the
          # process and takes an unrelated test with it.
          docker run --rm --privileged \
            -e CCACHE_DIR=/ccache \
            -e EVPL_IO_URING_ENTRIES=1024 \
            -e CCACHE_MAXSIZE \
            -v "${{ runner.temp }}/ccache:/ccache" \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/oras:/usr/local/bin/oras:ro" \
            -v /build \
            -w /build \
            ${{ env.DEV_IMAGE_TAG_PREFIX }}:${{ github.sha }}-${{ matrix.arch }} \
            bash -euxc '
              mkdir -p /workspace/ctest-results
              # ccache keeps its counters inside the cache directory, so a
              # restored cache carries the statistics of the run that made it.
              # Left alone, --show-stats reports both runs summed: the first
              # consumer read showed "945/1894 (49.89%)" for a build that was
              # really 945 of 947, 99.8%.  Zero them so the number means what it
              # looks like it means.
              ccache -z > /dev/null
              cmake -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DREQUIRE_NETNS_TESTS=ON -DPYNFS_JUNIT_DIR=/workspace/ctest-results/pynfs-junit -DSMBTORTURE_JUNIT_DIR=/workspace/ctest-results/smbtorture-junit -DWPTS_JUNIT_DIR=/workspace/ctest-results/wpts-junit -DPIKE_JUNIT_DIR=/workspace/ctest-results/pike-junit ${{ matrix.kvm_cmake }} /workspace
              ninja
              ccache --show-stats || true
              # Trim to the configured ceiling before the save, so the entry
              # the other workflows restore stays a predictable size.
              ccache --trim-max-size ${CCACHE_MAXSIZE} || true
              start=$(date +%s)
              rc=0
              /workspace/scripts/cap_ctest_output.sh ctest --output-on-failure --test-output-size-failed 65536 --timeout 300 -j "$(nproc)" --output-junit /workspace/ctest-results/results.xml || rc=$?
              echo "$(( $(date +%s) - start ))" > /workspace/ctest-results/duration_seconds
              exit $rc'

      # The container runs as root, so everything it wrote into the bind-mounted
      # cache is root-owned and the runner user cannot tar it up.
      - name: Take ownership of the ccache directory
        if: always() && github.event_name == 'push'
        run: sudo chown -R "$(id -u):$(id -g)" "${{ runner.temp }}/ccache"

      # Saved even when the job failed: the cache reflects a build that
      # happened, and withholding it would make every later run pay for a
      # failure that has nothing to do with compilation.  This is why restore
      # and save are split -- actions/cache saves only on a successful job.
      - name: Save the ccache directory
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v2-devcontainer-${{ matrix.arch }}-${{ matrix.build_type }}-${{ github.sha }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ctest-junit-devcontainer-${{ matrix.arch }}-${{ matrix.build_type }}
          path: ctest-results/
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # macOS: compile + ctest on a GitHub-hosted arm64 runner, modeled on
  # libevpl's macos job.  Nothing here is containerised and none of the
  # Linux-only pieces exist (io_uring, libaio, KVM, netns, RDMA, the linux
  # passthrough backend), so this covers the kqueue event core, the in-process
  # test transport, and every portable path above them -- the combination the
  # Linux matrix never exercises.  Like the rest of the matrix it runs only in
  # the merge queue; ci-complete aggregates it for branch protection.
  #
  # No netns and no raised limits on a hosted runner: the in-process suites
  # run gate-free (CHIMERA_LIMITS_TESTING passes vacuously off Linux) and the
  # genuinely networked suites serialize under the chimera_net lock.
  # ---------------------------------------------------------------------------
  macos:
    name: Test macOS ${{ matrix.build_type }}
    runs-on: macos-14
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        env:
          CCACHE_REF: ghcr.io/chimera-nas/ccache:4.14-darwin
        run: |
          brew update
          # bison: Apple ships 2.3 and the ndrzcc grammar needs 3.x; the
          # top-level CMakeLists already adds the keg-only Homebrew path.
          # libxcrypt: Darwin libc crypt(3) is DES-only, and REST auth needs
          # full crypt(5) $-scheme verification.
          brew install cmake ninja bison jansson userspace-rcu rocksdb krb5 \
                       xxhash libxcrypt uthash openssl@3 libnghttp2
          # oras: ext/specs' trace corpus comes from the bundle its CI
          # published for the pinned commit, rather than being regenerated
          # here.  A CI checkout never has local edits to the submodule, so
          # the bundle always applies, and pulling it is both lighter than
          # running quint over every model and free of quint's
          # parallel-generator download race.
          brew install oras

          # ccache from the same mirror the Linux images use, so every platform
          # in the matrix runs one pinned upstream build rather than whatever
          # its packager happened to ship.  Upstream's darwin asset is a single
          # universal binary, so this covers both Intel and Apple Silicon.
          oras pull "${CCACHE_REF}" --output "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/ccache-darwin" /usr/local/bin/ccache
          ccache --version | head -1

      # Note where the writes come from.  Actions caches are branch-scoped: a
      # run reads its own ref and the default branch's.  This workflow only ever
      # runs on merge_group, and that gh-readonly-queue/... ref is discarded, so
      # nothing it saves is ever seen again.  The entry that matters is the one
      # extended.yml writes on main; this restores that.  Worst case it is a few
      # stale, which for ccache means a slightly lower hit rate and nothing
      # worse.
      - name: Restore the ccache directory
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v2-macos-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-macos-${{ matrix.build_type }}-

      # quint from the mirrored darwin payload rather than the npm registry and
      # the GitHub releases endpoint.  Only the Rust evaluator is platform
      # specific -- quint itself is JavaScript -- so this is the same tree the
      # Linux images get, plus the darwin evaluator, pre-placed where quint
      # looks for it.
      #
      # That pre-placement is a gate, not a nicety.  quint's default rust
      # backend fetches the evaluator on first use and ABORTS rather than
      # falling back to its interpreter when the fetch fails; a merge-queue run
      # has already died that way on an anonymous, rate-limited releases API
      # call, and the run after it found a half-written ~/.quint and died in
      # chmod.  Nothing is fetched at job time now.
      - name: Install quint from the mirrored payload
        run: |
          set -euo pipefail
          # Pinned by ext/specs/.quint-version, not hardcoded here: trace
          # generation is seeded and reproducible for a given quint release,
          # and that file is what records the release the corpus was generated
          # against.  The mirrored tag follows it.
          qver=$(tr -d '[:space:]' < ext/specs/.quint-version)
          oras pull "ghcr.io/chimera-nas/quint:${qver}-darwin" \
               --output "${RUNNER_TEMP}/quint-dl"
          mkdir -p "${RUNNER_TEMP}/quint"
          tar -xzf "${RUNNER_TEMP}/quint-dl/quint-darwin.tar.gz" \
              -C "${RUNNER_TEMP}/quint"
          ver=$(cat "${RUNNER_TEMP}/quint/evaluator-version")
          case "$(uname -m)" in
            arm64|aarch64) ev=quint_evaluator-aarch64 ;;
            x86_64)        ev=quint_evaluator-x86_64 ;;
            *) echo "no quint evaluator for $(uname -m)" >&2; exit 1 ;;
          esac
          dir="$HOME/.quint/rust-evaluator-$ver"
          mkdir -p "$dir"
          install -m 0755 "${RUNNER_TEMP}/quint/rust-evaluator-$ver/$ev" \
                  "$dir/quint_evaluator"
          echo "${RUNNER_TEMP}/quint/quint/bin" >> "$GITHUB_PATH"
          # --help, not --version: the evaluator rejects the latter and exits 1.
          "$dir/quint_evaluator" --help > /dev/null
          "${RUNNER_TEMP}/quint/quint/bin/quint" --version

      - name: Configure and build
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: 2G
        run: |
          # Counters ride along in the restored cache; zero them so the stats
          # below describe this run alone.
          ccache -z > /dev/null
          cmake -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DSPECS_BUNDLE=ON -DREQUIRE_CTL_MBT=ON \
                -S "${{ github.workspace }}" -B "${{ runner.temp }}/build"
          ninja -C "${{ runner.temp }}/build"
          ccache --show-stats || true
          # Trim to the configured ceiling before the save, so the entry the
          # other workflows restore stays a predictable size.
          ccache --trim-max-size ${CCACHE_MAXSIZE} || true

      - name: Test
        run: |
          cd "${{ runner.temp }}/build"
          mkdir -p "${{ github.workspace }}/ctest-results"
          start=$(date +%s)
          rc=0
          "${{ github.workspace }}/scripts/cap_ctest_output.sh" \
            ctest --output-on-failure --test-output-size-failed 65536 \
                  --timeout 300 -j "$(sysctl -n hw.ncpu)" \
                  --output-junit "${{ github.workspace }}/ctest-results/results.xml" || rc=$?
          echo "$(( $(date +%s) - start ))" > "${{ github.workspace }}/ctest-results/duration_seconds"
          exit $rc

      # Saved even when the job failed: the cache reflects a build that
      # happened, and withholding it would make every later run pay for a
      # failure that has nothing to do with compilation.  This is why restore
      # and save are split -- actions/cache saves only on a successful job.
      - name: Save the ccache directory
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v2-macos-${{ matrix.build_type }}-${{ github.sha }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ctest-junit-macos-${{ matrix.build_type }}
          path: ctest-results/
          if-no-files-found: warn
          retention-days: 30

  # macOS static analysis.  Same cached-analyzer driver as the Linux cells; see
  # the static-analysis job above for why scan-build cannot be cached.
  #
  # This was the single most expensive job in the queue -- 611s to 646s of
  # analysis on a three-core hosted runner, on top of everything else -- because
  # scan-build had to do a full uncached instrumented build every time.
  #
  # llvm is still installed: dropping it would silently switch the analyzer to
  # Apple's clang, and keeping the same analyzer the queue has always used is
  # worth 70s of brew.  ccache comes from the same mirror as everywhere else.
  analyze-macos:
    name: Analyze macOS ${{ matrix.build_type }}
    runs-on: macos-14
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        env:
          CCACHE_REF: ghcr.io/chimera-nas/ccache:4.14-darwin
        run: |
          brew update
          # llvm: the analyzer this job has always run.  bison 3.x for the
          # ndrzcc grammar, libxcrypt for full crypt(5) verification.
          # No llvm: scan-build needed it for the analyzer *driver*, but driving
          # `clang --analyze` directly does not.  Dropping it also keeps this
          # job on Apple's clang -- the compiler ccc-analyzer was always
          # actually compiling with, since it invokes whatever `clang` resolves
          # to on PATH and only used brew's LLVM for the analysis pass.  Pinning
          # brew's clang for the whole build instead surfaced a warning Apple's
          # does not have (-Wunused-but-set-global) straight into -Werror.
          brew install cmake ninja bison jansson userspace-rcu rocksdb krb5 \
                       xxhash libxcrypt uthash openssl@3 libnghttp2 oras
          oras pull "${CCACHE_REF}" --output "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/ccache-darwin" /usr/local/bin/ccache
          ccache --version | head -1

      # Written by extended.yml, which runs on main; a merge_group ref is thrown
      # away, so the queue restores but never usefully saves.
      - name: Restore the ccache directory
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v2-macos-analyze-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-macos-analyze-${{ matrix.build_type }}-

      - name: Run the clang static analyzer
        id: static-analysis
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: 2G
          BUILD_DIR: ${{ runner.temp }}/build-analyze
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/scan-report"
          # Counters ride along in the restored cache; zero them so the stats
          # below describe this run alone.
          ccache -z > /dev/null
          cmake -G Ninja -D CMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                \
                -D CMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -D SPECS_BUNDLE=NONE \
                -S "$GITHUB_WORKSPACE" -B "$BUILD_DIR"
          # compile_commands.json is not enough on its own: several entries
          # include generated headers, so the tree has to be built first.
          ninja -C "$BUILD_DIR"
          # --exclude ext: the vendored submodules are analysed in their own
          # repos and cannot be fixed from a chimera PR.
          python3 "$GITHUB_WORKSPACE/scripts/analyze_cached.py" \
                  --build-dir "$BUILD_DIR" \
                  --report-dir "$GITHUB_WORKSPACE/scan-report" \
                  --exclude "$GITHUB_WORKSPACE/ext/" \
                  -j "$(sysctl -n hw.ncpu)" \
            2>&1 | tee "$GITHUB_WORKSPACE/scan-report/analyzer-output.txt"
          ccache --show-stats || true
          # Trimmed AFTER the analyzer, not between the build and it: the
          # entries worth keeping are the --analyze ones, and they do not exist
          # yet at that point.  || true because the trim is best-effort.
          ccache --trim-max-size ${CCACHE_MAXSIZE} || true

      # Saved even when the job failed: the cache reflects a build that
      # happened, and withholding it would make every later run pay for a
      # failure that has nothing to do with compilation.  This is why restore
      # and save are split -- actions/cache saves only on a successful job.
      - name: Save the ccache directory
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v2-macos-analyze-${{ matrix.build_type }}-${{ github.sha }}

      - name: Upload static analysis report
        if: ${{ failure() && steps.static-analysis.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: analyzer-report-macos-${{ matrix.build_type }}
          path: scan-report/
          if-no-files-found: warn
          retention-days: 30

  # Single stable aggregate of the whole build/test matrix, so the merge
  # queue's required-checks list is one name instead of every matrix cell
  # (and survives matrix changes). Mark this job as a required status check.
  ci-complete:
    name: CI complete
    needs:
      - build-devcontainer
      - build-ubuntu26
      - build-ubuntu24
      - build-ubuntu22
      - build-rocky9
      - build-rocky10
      - test
      - test-dev
      - static-analysis
      - macos
      - analyze-macos
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify all build/test jobs passed
        run: |
          # Every dependency must be `success`.  Checking results rather than
          # using success() means a job that was skipped -- never actually run --
          # cannot pass this for the wrong reason.
          results='${{ join(needs.*.result, ' ') }}'
          echo "dependency results: ${results}"
          for r in ${results}; do
            if [ "$r" != "success" ]; then
              echo "a required job did not succeed"
              exit 1
            fi
          done
