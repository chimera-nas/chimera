name: CI

on:
  # The full build/test matrix runs ONLY in the merge queue, never on raw PRs;
  # the PR-time half of the gate lives in pr-checks.yml.  There is no
  # pull_request trigger here, so the jobs below carry no event guards: every
  # job in this file runs on every event that reaches it.
  merge_group:
  workflow_dispatch:   # allow manual runs

# What gates a merge is the QUICK test tier plus static analysis, run on every
# supported OS rather than on a chosen few:
#   - all OS images built for amd64 (devcontainer also for arm64)
#   - quick-tier ctest on every image, and on macOS
#   - static analysis on every image, and on macOS
#
# The extended tier -- pynfs, pjdfstest, cthon, ltp, pike, smbtorture, wpts,
# KVM -- runs in .github/workflows/extended.yml, one job per platform.  It is
# too slow to sit in front of a merge, and the queue is the wrong place to
# discover that a KVM guest image moved.
#
# There is no flaky-test rescue.  A test that fails, fails: no re-run, no
# marker artifact, no review gate.  A retry that turns red into green hides
# exactly the race a merge queue exists to catch, and the rescued-flake path
# was where a real failure could reach main behind an approval click.
#
# The run is two phases, fanned out as wide as possible within each, and the
# job display names follow the phase ("Build X" = container image, "Test X" /
# "Analyze X" = the source tree) so the CI details view reads unambiguously:
#   1. Build   container images              (build-devcontainer, build-<os>)
#   2. Test    compile + ctest, with static  (test, test-dev,
#              analysis running alongside     static-analysis)
#
# Phase 2 has no internal barrier: compile and test are a single job, and the
# analysis starts beside them rather than behind them.  There is exactly one
# test job per compile now, so handing a build tree between two jobs bought
# nothing and cost a tar, a Nexus round trip, and a second checkout -- and
# scan-build does its own instrumented compile, so it never wanted that build
# tree at all.  Everything downstream of the container images starts at once.

env:
  DEV_IMAGE_TAG_PREFIX: repository.mdh.quantum.com:5004/cache/chimera-dev
  U26_IMAGE_TAG_PREFIX: repository.mdh.quantum.com:5004/cache/chimera-ubuntu26
  U24_IMAGE_TAG_PREFIX: repository.mdh.quantum.com:5004/cache/chimera-ubuntu24
  U22_IMAGE_TAG_PREFIX: repository.mdh.quantum.com:5004/cache/chimera-ubuntu22
  R9_IMAGE_TAG_PREFIX: repository.mdh.quantum.com:5004/cache/chimera-rocky9
  R10_IMAGE_TAG_PREFIX: repository.mdh.quantum.com:5004/cache/chimera-rocky10
  # Internal pull-through cache for the mirrored ccache image (mirrors
  # ghcr.io/chimera-nas/ccache, republished from upstream by
  # .github/workflows/mirror-ccache.yml).  Public default lives in the
  # Dockerfiles, so an image still builds outside this infrastructure.
  CCACHE_IMAGE_REGISTRY: repository.mdh.quantum.com:5009/chimera-nas/ccache
  # Internal pull-through cache for the prebuilt KVM guest images (mirrors
  # ghcr.io/chimera-nas/kvm-test-base). Public default lives in CMake.
  KVM_IMAGE_REGISTRY: repository.mdh.quantum.com:5009/chimera-nas/kvm-test-base
  APT_MIRROR: http://repository.mdh.quantum.com/repository/pkgs/ubuntu
  DOCKER_MIRROR: repository.mdh.quantum.com/
  # Shared compiler cache.  Every job here uses a purely *local* ccache, primed
  # before the build from a bundle the Extended workflow published for that cell.
  #
  # This replaces ccache's HTTP remote backend, which fetched each object over
  # the network as the build asked for it.  That put ~950 round trips per job on
  # the critical path -- against a Nexus being hit by a dozen jobs at once --
  # and its 100ms default connect timeout turned the tail of that into misses:
  # on run 33270040519, ubuntu24 Debug lost 358 of its 410 misses to timeouts
  # and finished at 57% while its Release twin sat at 91%.
  #
  # One bundle fetch per job costs one round trip and leaves the build reading a
  # local directory, which cannot time out.  Same shape macOS uses with
  # actions/cache, and the same division of labour: the scheduled Extended run
  # writes, everything else only reads.
  NEXUS_SCRATCH_URL: http://repository.mdh.quantum.com/repository/scratch

jobs:
  build-devcontainer:
    name: Build devcontainer ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: arc-amd64
            arch: amd64
          - platform: linux/arm64
            runner: arc-arm64
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["repository.mdh.quantum.com:5001"]

      - name: Build and push the dev container image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.DEV_IMAGE_TAG_PREFIX }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=repository.mdh.quantum.com:5004/cache/chimera-dev:${{ matrix.arch }}
          cache-to: type=registry,ref=repository.mdh.quantum.com:5004/cache/chimera-dev:${{ matrix.arch }},mode=max
          build-args: |
            APT_MIRROR=${{ env.APT_MIRROR }}
            DOCKER_MIRROR=${{ env.DOCKER_MIRROR }}
            CCACHE_REGISTRY=${{ env.CCACHE_IMAGE_REGISTRY }}

  build-ubuntu26:
    name: Build ubuntu26 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: arc-amd64
            arch: amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["repository.mdh.quantum.com:5001"]

      - name: Build and push the ubuntu26 CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ubuntu26.04
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.U26_IMAGE_TAG_PREFIX }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=repository.mdh.quantum.com:5004/cache/chimera-ubuntu26:${{ matrix.arch }}
          cache-to: type=registry,ref=repository.mdh.quantum.com:5004/cache/chimera-ubuntu26:${{ matrix.arch }},mode=max
          build-args: |
            APT_MIRROR=${{ env.APT_MIRROR }}
            DOCKER_MIRROR=${{ env.DOCKER_MIRROR }}
            CCACHE_REGISTRY=${{ env.CCACHE_IMAGE_REGISTRY }}

  build-ubuntu24:
    name: Build ubuntu24 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: arc-amd64
            arch: amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["repository.mdh.quantum.com:5001"]

      - name: Build and push the ubuntu24 CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ubuntu24.04
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.U24_IMAGE_TAG_PREFIX }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=repository.mdh.quantum.com:5004/cache/chimera-ubuntu24:${{ matrix.arch }}
          cache-to: type=registry,ref=repository.mdh.quantum.com:5004/cache/chimera-ubuntu24:${{ matrix.arch }},mode=max
          build-args: |
            APT_MIRROR=${{ env.APT_MIRROR }}
            DOCKER_MIRROR=${{ env.DOCKER_MIRROR }}
            CCACHE_REGISTRY=${{ env.CCACHE_IMAGE_REGISTRY }}

  build-ubuntu22:
    name: Build ubuntu22 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: arc-amd64
            arch: amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["repository.mdh.quantum.com:5001"]

      - name: Build and push the ubuntu22 CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ubuntu22.04
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.U22_IMAGE_TAG_PREFIX }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=repository.mdh.quantum.com:5004/cache/chimera-ubuntu22:${{ matrix.arch }}
          cache-to: type=registry,ref=repository.mdh.quantum.com:5004/cache/chimera-ubuntu22:${{ matrix.arch }},mode=max
          build-args: |
            APT_MIRROR=${{ env.APT_MIRROR }}
            DOCKER_MIRROR=${{ env.DOCKER_MIRROR }}
            CCACHE_REGISTRY=${{ env.CCACHE_IMAGE_REGISTRY }}

  build-rocky9:
    name: Build rocky9 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: arc-amd64
            arch: amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["repository.mdh.quantum.com:5001"]

      - name: Build and push the rocky9 CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.rocky9
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.R9_IMAGE_TAG_PREFIX }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=repository.mdh.quantum.com:5004/cache/chimera-rocky9:${{ matrix.arch }}
          cache-to: type=registry,ref=repository.mdh.quantum.com:5004/cache/chimera-rocky9:${{ matrix.arch }},mode=max
          build-args: |
            DOCKER_MIRROR=${{ env.DOCKER_MIRROR }}
            CCACHE_REGISTRY=${{ env.CCACHE_IMAGE_REGISTRY }}

  build-rocky10:
    name: Build rocky10 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: arc-amd64
            arch: amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["repository.mdh.quantum.com:5001"]

      - name: Build and push the rocky10 CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.rocky10
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.R10_IMAGE_TAG_PREFIX }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=repository.mdh.quantum.com:5004/cache/chimera-rocky10:${{ matrix.arch }}
          cache-to: type=registry,ref=repository.mdh.quantum.com:5004/cache/chimera-rocky10:${{ matrix.arch }},mode=max
          build-args: |
            DOCKER_MIRROR=${{ env.DOCKER_MIRROR }}
            CCACHE_REGISTRY=${{ env.CCACHE_IMAGE_REGISTRY }}

  # Distro compile + test: configure, build, and run this image's quick-tier
  # ctest, all in one container.  needs is the container images alone -- there
  # is no compile barrier, so a cell starts the moment its image exists and
  # its tests are not held back by the slowest compile in the matrix.
  test:
    name: Test ${{ matrix.image_name }} ${{ matrix.arch }} ${{ matrix.build_type }}
    needs: [build-ubuntu26, build-ubuntu24, build-ubuntu22, build-rocky9, build-rocky10]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # NOTE: the devcontainer has its own test-dev job below -- it is the
          # one image built for both arches, and it configures KVM on; it is
          # not part of this distro matrix.
          # ubuntu 26 (amd64 only on PR; arm64 runs in the extended workflow)
          - platform: linux/amd64
            runner: arc-amd64
            arch: amd64
            build_type: Release
            image_tag_prefix: repository.mdh.quantum.com:5004/cache/chimera-ubuntu26
            image_name: ubuntu26
            cmake_extra: "-DKVM_TESTING=OFF"
          - platform: linux/amd64
            runner: arc-amd64
            arch: amd64
            build_type: Debug
            image_tag_prefix: repository.mdh.quantum.com:5004/cache/chimera-ubuntu26
            image_name: ubuntu26
            cmake_extra: "-DKVM_TESTING=OFF"
          # ubuntu 24 (amd64 only on PR; arm64 runs in the extended workflow)
          - platform: linux/amd64
            runner: arc-amd64
            arch: amd64
            build_type: Release
            image_tag_prefix: repository.mdh.quantum.com:5004/cache/chimera-ubuntu24
            image_name: ubuntu24
            cmake_extra: "-DKVM_TESTING=OFF"
          - platform: linux/amd64
            runner: arc-amd64
            arch: amd64
            build_type: Debug
            image_tag_prefix: repository.mdh.quantum.com:5004/cache/chimera-ubuntu24
            image_name: ubuntu24
            cmake_extra: "-DKVM_TESTING=OFF"
          # ubuntu 22 (amd64 only on PR; arm64 runs in the extended workflow)
          - platform: linux/amd64
            runner: arc-amd64
            arch: amd64
            build_type: Release
            image_tag_prefix: repository.mdh.quantum.com:5004/cache/chimera-ubuntu22
            image_name: ubuntu22
            cmake_extra: "-DIO_URING_ENABLED=OFF -DKVM_TESTING=OFF"
          - platform: linux/amd64
            runner: arc-amd64
            arch: amd64
            build_type: Debug
            image_tag_prefix: repository.mdh.quantum.com:5004/cache/chimera-ubuntu22
            image_name: ubuntu22
            cmake_extra: "-DIO_URING_ENABLED=OFF -DKVM_TESTING=OFF"
          # rocky 9 (io_uring disabled: kernel 5.14 + ASAN causes timeouts, see #197)
          - platform: linux/amd64
            runner: arc-amd64
            arch: amd64
            build_type: Release
            image_tag_prefix: repository.mdh.quantum.com:5004/cache/chimera-rocky9
            image_name: rocky9
            cmake_extra: "-DIO_URING_ENABLED=OFF -DKVM_TESTING=OFF"
          - platform: linux/amd64
            runner: arc-amd64
            arch: amd64
            build_type: Debug
            image_tag_prefix: repository.mdh.quantum.com:5004/cache/chimera-rocky9
            image_name: rocky9
            cmake_extra: "-DIO_URING_ENABLED=OFF -DKVM_TESTING=OFF"
          # rocky 10 (amd64 only on PR; arm64 runs in the extended workflow)
          - platform: linux/amd64
            runner: arc-amd64
            arch: amd64
            build_type: Release
            image_tag_prefix: repository.mdh.quantum.com:5004/cache/chimera-rocky10
            image_name: rocky10
            cmake_extra: "-DKVM_TESTING=OFF"
          - platform: linux/amd64
            runner: arc-amd64
            arch: amd64
            build_type: Debug
            image_tag_prefix: repository.mdh.quantum.com:5004/cache/chimera-rocky10
            image_name: rocky10
            cmake_extra: "-DKVM_TESTING=OFF"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # KVM guest images are pulled from GHCR (chimera-nas/kvm-test-base) with
      # oras at configure time, instead of being built via inner dind.  Fetch
      # the static oras binary on the runner and mount it into the container.
      - name: Fetch oras CLI
        uses: ./.github/actions/fetch-oras
        with:
          arch: ${{ matrix.arch }}

      # Best-effort: a missing bundle (a new cell, an object aged out of scratch,
      # the first run after a key change) means a cold build, never a failed job.
      - name: Restore the ccache bundle
        env:
          NEXUS_USER: ${{ secrets.NEXUS_SCRATCH_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_SCRATCH_PASSWORD }}
        run: |
          key="${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}"
          curl -fsS --retry 3 --retry-all-errors --retry-delay 5 \
            -u "${NEXUS_USER}:${NEXUS_PASSWORD}" \
            -o ccache-bundle.tar.gz \
            "${{ env.NEXUS_SCRATCH_URL }}/chimera/ccache/${key}.tar.gz" \
            || echo "no ccache bundle for ${key}; this build starts cold"

      - name: Configure, build, and test inside the container
        run: |
          docker run --rm --privileged \
            -e DOCKER_MIRROR=${{ env.DOCKER_MIRROR }} \
            -e APT_MIRROR=${{ env.APT_MIRROR }} \
            -e CCACHE_DIR=/build/ccache \
            -e CCACHE_MAXSIZE=2G \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/oras:/usr/local/bin/oras:ro" \
            -v /build \
            -w /build \
            ${{ matrix.image_tag_prefix }}:${{ github.sha }}-${{ matrix.arch }} \
            bash -euxc '
              mkdir -p /workspace/ctest-results /build/ccache
              if [ -f /workspace/ccache-bundle.tar.gz ]; then
                tar -C /build/ccache -xzf /workspace/ccache-bundle.tar.gz
              fi
              # ccache keeps its counters inside the cache directory, so a
              # restored bundle carries the statistics of the run that made it.
              # Left alone, --show-stats reports both runs summed: the first
              # consumer read showed "945/1894 (49.89%)" for a build that was
              # really 945 of 947, 99.8%.  Zero them so the number means what it
              # looks like it means.
              ccache -z > /dev/null
              cmake -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DREQUIRE_NETNS_TESTS=ON -DKVM_IMAGE_REGISTRY=${{ env.KVM_IMAGE_REGISTRY }} -DPYNFS_JUNIT_DIR=/workspace/ctest-results/pynfs-junit -DSMBTORTURE_JUNIT_DIR=/workspace/ctest-results/smbtorture-junit -DWPTS_JUNIT_DIR=/workspace/ctest-results/wpts-junit -DPIKE_JUNIT_DIR=/workspace/ctest-results/pike-junit ${{ matrix.cmake_extra }} /workspace
              ninja
              ccache --show-stats || true
              start=$(date +%s)
              rc=0
              /workspace/scripts/cap_ctest_output.sh ctest --output-on-failure --test-output-size-failed 65536 --timeout 300 -j 32 --output-junit /workspace/ctest-results/results.xml || rc=$?
              echo "$(( $(date +%s) - start ))" > /workspace/ctest-results/duration_seconds
              exit $rc'

      # Per-test results for the report: ctest --output-junit (one <testcase>
      # per CTest test) + the pynfs per-code JUnit (the combined pynfs runs are a
      # single CTest test, so their ~500 codes only show up in their own JUnit) +
      # the ctest wall-clock.  if: always() so results publish even when the test
      # step failed (which is exactly when they are most useful).
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ctest-junit-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}
          path: ctest-results/
          if-no-files-found: warn
          retention-days: 30

  # Static analysis, running alongside the tests from the moment the container
  # images exist rather than behind them.  A finding never blocks a test from
  # starting; it still gates ci-complete.
  #
  # This drives the analyzer directly rather than through scan-build, because
  # scan-build cannot be cached.  It sets CC to ccc-analyzer, which compiles the
  # TU *and*, as a side effect, writes a report into a directory named by an
  # environment variable.  ccache caches the object and the stderr and knows
  # nothing about that side effect, so a hit replays a compile that looks
  # identical while producing no report -- and --status-bugs then sees a clean
  # run.  Verified: identical source goes from "1 bug found" to "No bugs found"
  # on a warm cache, warning text still printed.  So scan-build has to run with
  # ccache off, which meant a full cold build of the tree in all 14 cells --
  # and these were the 13 slowest jobs in the queue.
  #
  # `clang --analyze -o report.plist` makes the report the primary output, which
  # is exactly what ccache already knows how to cache: a hit restores the plist
  # with its findings intact, and a real source change invalidates it.  Findings
  # were checked against scan-build on a sample covering leak, use-after-free,
  # null deref and divide-by-zero: identical set, identical locations.
  static-analysis:
    name: Analyze ${{ matrix.image_name }} ${{ matrix.arch }} ${{ matrix.build_type }}
    needs: [build-devcontainer, build-ubuntu26, build-ubuntu24, build-ubuntu22, build-rocky9, build-rocky10]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every supported OS image.  The distro images are built amd64-only
          # here (see the test job); the devcontainer is the one built for both
          # arches, so it is the only one analysed on arm64 too.
          - platform: linux/amd64
            runner: arc-amd64
            arch: amd64
            build_type: Release
            image_tag_prefix: repository.mdh.quantum.com:5004/cache/chimera-dev
            image_name: devcontainer
            cmake_extra: ""
          - platform: linux/arm64
            runner: arc-arm64
            arch: arm64
            build_type: Release
            image_tag_prefix: repository.mdh.quantum.com:5004/cache/chimera-dev
            image_name: devcontainer
            cmake_extra: ""
          - platform: linux/amd64
            runner: arc-amd64
            arch: amd64
            build_type: Release
            image_tag_prefix: repository.mdh.quantum.com:5004/cache/chimera-ubuntu26
            image_name: ubuntu26
            cmake_extra: ""
          - platform: linux/amd64
            runner: arc-amd64
            arch: amd64
            build_type: Release
            image_tag_prefix: repository.mdh.quantum.com:5004/cache/chimera-ubuntu24
            image_name: ubuntu24
            cmake_extra: ""
          - platform: linux/amd64
            runner: arc-amd64
            arch: amd64
            build_type: Release
            image_tag_prefix: repository.mdh.quantum.com:5004/cache/chimera-ubuntu22
            image_name: ubuntu22
            cmake_extra: "-DIO_URING_ENABLED=OFF"
          - platform: linux/amd64
            runner: arc-amd64
            arch: amd64
            build_type: Release
            image_tag_prefix: repository.mdh.quantum.com:5004/cache/chimera-rocky9
            image_name: rocky9
            cmake_extra: "-DIO_URING_ENABLED=OFF"
          - platform: linux/amd64
            runner: arc-amd64
            arch: amd64
            build_type: Release
            image_tag_prefix: repository.mdh.quantum.com:5004/cache/chimera-rocky10
            image_name: rocky10
            cmake_extra: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # Best-effort, as elsewhere; a miss just means a cold analysis.
      - name: Restore the ccache bundle
        env:
          NEXUS_USER: ${{ secrets.NEXUS_SCRATCH_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_SCRATCH_PASSWORD }}
        run: |
          key="analyze-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}"
          curl -fsS --retry 3 --retry-all-errors --retry-delay 5 \
            -u "${NEXUS_USER}:${NEXUS_PASSWORD}" \
            -o ccache-bundle.tar.gz \
            "${{ env.NEXUS_SCRATCH_URL }}/chimera/ccache/${key}.tar.gz" \
            || echo "no ccache bundle for ${key}; this analysis starts cold"

      - name: Run the clang static analyzer
        id: static-analysis
        run: |
          set -o pipefail
          mkdir -p "${{ github.workspace }}/scan-report"
          docker run --rm --privileged \
            -e DOCKER_MIRROR=${{ env.DOCKER_MIRROR }} \
            -e APT_MIRROR=${{ env.APT_MIRROR }} \
            -e CCACHE_DIR=/build/ccache \
            -e CCACHE_MAXSIZE=2G \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/scan-report:/scan-report" \
            -v /build \
            -w /build \
            ${{ matrix.image_tag_prefix }}:${{ github.sha }}-${{ matrix.arch }} \
            bash -euxc '
              mkdir -p /build/ccache
              if [ -f /workspace/ccache-bundle.tar.gz ]; then
                tar -C /build/ccache -xzf /workspace/ccache-bundle.tar.gz
              fi
              # ccache keeps its counters inside the cache directory, so a
              # restored bundle carries the statistics of the run that made it.
              # Left alone, --show-stats reports both runs summed: the first
              # consumer read showed "945/1894 (49.89%)" for a build that was
              # really 945 of 947, 99.8%.  Zero them so the number means what it
              # looks like it means.
              ccache -z > /dev/null
              cmake -D CMAKE_BUILD_TYPE=${{ matrix.build_type }} -D CMAKE_C_COMPILER=clang -D CMAKE_EXPORT_COMPILE_COMMANDS=ON -D IO_URING_NVME_ENABLED=OFF ${{ matrix.cmake_extra }} -B /build -S /workspace -G Ninja
              # The analyzer reads compile_commands.json, and several entries
              # include generated headers (xdrzcc, ndrzcc, flex, bison), so the
              # tree has to be built before it can run.  Against a primed cache
              # that is close to free.
              ninja -C /build
              python3 /workspace/scripts/analyze_cached.py \
                      --build-dir /build --report-dir /scan-report \
                      --exclude /workspace/ext/ -j "$(nproc)"
              ccache --show-stats || true' \
            2>&1 | tee "${{ github.workspace }}/scan-report/analyzer-output.txt"

      - name: Upload static analysis report
        if: ${{ failure() && steps.static-analysis.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: analyzer-report-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}
          path: scan-report/
          if-no-files-found: warn
          retention-days: 30

  # Aggregate every test job's results into one report -- a per-run table (wall
  # clock + summed test time + pass/fail counts) plus every failed test named --
  # so a PR shows what broke without digging through the ~12k-line log of each
  # matrix job.  Runs after the whole matrix (always, so a failing run still
  # reports) and never fails the build: the test jobs stay the source of truth.
  publish-test-results:
    name: Report
    needs: [test, test-dev, macos]
    if: ${{ always() }}
    runs-on: arc-small
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download test-result artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: ctest-junit-*
          path: results

      # Render the report into the run summary (always) and, on a PR, into a
      # single sticky PR comment.  Pure-Python + stdlib urllib -- no external
      # action and no `gh` CLI (the self-hosted runners have neither).
      - name: Render and publish report
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/ci_test_report.py results > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          # The summary above is the primary output; the PR comment is
          # best-effort (don't fail the job if the API call hiccups).
          if [ -n "${PR_NUMBER:-}" ]; then
            python3 scripts/ci_pr_comment.py "$GH_REPO" "$PR_NUMBER" report.md \
              || echo "::warning::failed to post PR comment (report is in the run summary)"
          fi

  # Devcontainer compile + test: the same one-container shape as the distro
  # `test` job above, on the one image built for both arches.
  #
  # KVM guest images are not fetched (KVM_FETCH_IMAGES=OFF): the KVM suites are
  # extended-tier and run in the extended workflow, so the queue wants the KVM CMake path
  # configured but not the multi-gigabyte guest images behind it.  KVM is
  # x86-only in the devcontainer, so arm64 configures with it off entirely.
  test-dev:
    name: Test devcontainer ${{ matrix.arch }} ${{ matrix.build_type }}
    needs: [build-devcontainer]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: arc-amd64, build_type: Release, kvm_cmake: "-DKVM_TESTING=ON -DKVM_FETCH_IMAGES=OFF" }
          - { arch: amd64, runner: arc-amd64, build_type: Debug,   kvm_cmake: "-DKVM_TESTING=ON -DKVM_FETCH_IMAGES=OFF" }
          - { arch: arm64, runner: arc-arm64, build_type: Release, kvm_cmake: "-DKVM_TESTING=OFF" }
          - { arch: arm64, runner: arc-arm64, build_type: Debug,   kvm_cmake: "-DKVM_TESTING=OFF" }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # oras is needed at configure time: KVM_TESTING=ON probes for it.
      - name: Fetch oras CLI
        uses: ./.github/actions/fetch-oras
        with:
          arch: ${{ matrix.arch }}

      # Best-effort: a missing bundle (a new cell, an object aged out of scratch,
      # the first run after a key change) means a cold build, never a failed job.
      - name: Restore the ccache bundle
        env:
          NEXUS_USER: ${{ secrets.NEXUS_SCRATCH_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_SCRATCH_PASSWORD }}
        run: |
          key="devcontainer-${{ matrix.arch }}-${{ matrix.build_type }}"
          curl -fsS --retry 3 --retry-all-errors --retry-delay 5 \
            -u "${NEXUS_USER}:${NEXUS_PASSWORD}" \
            -o ccache-bundle.tar.gz \
            "${{ env.NEXUS_SCRATCH_URL }}/chimera/ccache/${key}.tar.gz" \
            || echo "no ccache bundle for ${key}; this build starts cold"

      - name: Configure, build, and test inside the container
        run: |
          docker run --rm --privileged \
            -e DOCKER_MIRROR=${{ env.DOCKER_MIRROR }} \
            -e APT_MIRROR=${{ env.APT_MIRROR }} \
            -e CCACHE_DIR=/build/ccache \
            -e CCACHE_MAXSIZE=2G \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/oras:/usr/local/bin/oras:ro" \
            -v /build \
            -w /build \
            ${{ env.DEV_IMAGE_TAG_PREFIX }}:${{ github.sha }}-${{ matrix.arch }} \
            bash -euxc '
              mkdir -p /workspace/ctest-results /build/ccache
              if [ -f /workspace/ccache-bundle.tar.gz ]; then
                tar -C /build/ccache -xzf /workspace/ccache-bundle.tar.gz
              fi
              # ccache keeps its counters inside the cache directory, so a
              # restored bundle carries the statistics of the run that made it.
              # Left alone, --show-stats reports both runs summed: the first
              # consumer read showed "945/1894 (49.89%)" for a build that was
              # really 945 of 947, 99.8%.  Zero them so the number means what it
              # looks like it means.
              ccache -z > /dev/null
              cmake -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DREQUIRE_NETNS_TESTS=ON -DKVM_IMAGE_REGISTRY=${{ env.KVM_IMAGE_REGISTRY }} -DPYNFS_JUNIT_DIR=/workspace/ctest-results/pynfs-junit -DSMBTORTURE_JUNIT_DIR=/workspace/ctest-results/smbtorture-junit -DWPTS_JUNIT_DIR=/workspace/ctest-results/wpts-junit -DPIKE_JUNIT_DIR=/workspace/ctest-results/pike-junit ${{ matrix.kvm_cmake }} /workspace
              ninja
              ccache --show-stats || true
              start=$(date +%s)
              rc=0
              /workspace/scripts/cap_ctest_output.sh ctest --output-on-failure --test-output-size-failed 65536 --timeout 300 -j 32 --output-junit /workspace/ctest-results/results.xml || rc=$?
              echo "$(( $(date +%s) - start ))" > /workspace/ctest-results/duration_seconds
              exit $rc'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ctest-junit-devcontainer-${{ matrix.arch }}-${{ matrix.build_type }}
          path: ctest-results/
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # macOS: compile + ctest on a GitHub-hosted arm64 runner, modeled on
  # libevpl's macos job.  Nothing here is containerised and none of the
  # Linux-only pieces exist (io_uring, libaio, KVM, netns, RDMA, the linux
  # passthrough backend), so this covers the kqueue event core, the in-process
  # test transport, and every portable path above them -- the combination the
  # Linux matrix never exercises.  Like the rest of the matrix it runs only in
  # the merge queue; ci-complete aggregates it for branch protection.
  #
  # No netns and no raised limits on a hosted runner: the in-process suites
  # run gate-free (CHIMERA_LIMITS_TESTING passes vacuously off Linux) and the
  # genuinely networked suites serialize under the chimera_net lock.
  # ---------------------------------------------------------------------------
  macos:
    name: Test macOS ${{ matrix.build_type }}
    runs-on: macos-14
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        env:
          # Public GHCR: a GitHub-hosted runner cannot reach the internal
          # pull-through proxy the ARC runners use.
          CCACHE_REF: ghcr.io/chimera-nas/ccache:4.14-darwin
        run: |
          brew update
          # bison: Apple ships 2.3 and the ndrzcc grammar needs 3.x; the
          # top-level CMakeLists already adds the keg-only Homebrew path.
          # libxcrypt: Darwin libc crypt(3) is DES-only, and REST auth needs
          # full crypt(5) $-scheme verification.
          brew install cmake ninja bison jansson userspace-rcu rocksdb krb5 \
                       xxhash libxcrypt uthash openssl@3 libnghttp2
          # oras: ext/specs' trace corpus comes from the bundle its CI
          # published for the pinned commit, rather than being regenerated
          # here.  A CI checkout never has local edits to the submodule, so
          # the bundle always applies, and pulling it is both lighter than
          # running quint over every model and free of quint's
          # parallel-generator download race.
          brew install oras

          # ccache from the same mirror the Linux images use, so every platform
          # in the matrix runs one pinned upstream build rather than whatever
          # its packager happened to ship.  Upstream's darwin asset is a single
          # universal binary, so this covers both Intel and Apple Silicon.
          oras pull "${CCACHE_REF}" --output "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/ccache-darwin" /usr/local/bin/ccache
          ccache --version | head -1

      # The Nexus cache the Linux cells share is unreachable from a
      # GitHub-hosted runner, so macOS uses GitHub's own cache for the ccache
      # directory instead.
      #
      # Note where the writes come from.  Actions caches are branch-scoped: a
      # run reads its own ref and the default branch's.  This workflow only ever
      # runs on merge_group, and that gh-readonly-queue/... ref is discarded, so
      # nothing it saves is ever seen again.  The entry that matters is the one
      # extended.yml writes on main; this restores that.  Worst case it is a few
      # stale, which for ccache means a slightly lower hit rate and nothing
      # worse.
      - name: Restore the ccache directory
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-macos-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-${{ matrix.build_type }}-

      # The bundle above covers ext/specs, but the control-plane model
      # (src/server/rest/tests/quint) lives in THIS repo, so no bundle exists
      # for it and its corpus is generated at build time.  Without quint that suite's replay and
      # coverage ctests disable themselves, which is exactly the silent loss
      # the bundle mechanism was introduced to stop happening elsewhere.
      #
      # The version is the one ext/specs pins, because a machine can only have
      # one quint on PATH and both models are generated by it.  Trace
      # generation is seeded, so a given release is reproducible; a different
      # release samples the state space differently, which for this suite
      # changes which traces you get but not whether they are valid -- the
      # corpus is generated and consumed within the same build and is never
      # compared against a published one.
      #
      # Nothing downloads a quint evaluator here: the control-plane targets
      # pass --backend=typescript for exactly that reason (see
      # src/server/rest/tests/quint/CMakeLists.txt).  quint --version is the
      # gate, so an unusable install fails in this step rather than partway
      # through the build.
      - name: Install quint for the in-tree control-plane model
        run: |
          npm install -g "@informalsystems/quint@$(tr -d '[:space:]' < ext/specs/.quint-version)"
          quint --version

      # Installing quint switches on EVERY quint target on this runner, not
      # just ours -- ext/libevpl's core/http/rpc2 conformance generators come
      # with it, and those use quint's default `rust` backend.  That backend
      # fetches its evaluator from the GitHub RELEASES API on first use, which
      # is anonymous and rate-limited: one merge-queue run died on "rate limit
      # exceeded", and the next found a half-written ~/.quint (version
      # directory created, binary never extracted) and died in chmod.  quint
      # does not fall back to its interpreter when that happens; it aborts.
      #
      # So place the binary ourselves, from the release DOWNLOAD url -- a
      # plain asset fetch, not an API call, so it does not share that limit.
      # binaryManager.js returns early when the executable is already present,
      # which makes every quint invocation on this runner skip the fetch,
      # including the ext/libevpl ones this repo does not edit.
      #
      # This is a gate, not a diagnostic.  The previous attempt at covering
      # this warmed the download and merely NOTED a miss, on the mistaken
      # belief that quint would fall back; the note duly appeared in the log
      # immediately before the build it had failed to prevent.
      - name: Pre-place the quint Rust evaluator
        run: |
          root=$(npm root -g)
          ver=$(node -e "console.log(require('$root/@informalsystems/quint/dist/src/rust/binaryManager').QUINT_EVALUATOR_VERSION)")
          case "$(uname -m)" in
            arm64|aarch64) asset=quint_evaluator-aarch64-apple-darwin.tar.gz ;;
            x86_64)        asset=quint_evaluator-x86_64-apple-darwin.tar.gz ;;
            *) echo "no quint evaluator asset for $(uname -m)"; exit 1 ;;
          esac
          dir="$HOME/.quint/rust-evaluator-$ver"
          mkdir -p "$dir"
          curl --fail --location --retry 5 --retry-all-errors \
               --silent --show-error -o "$RUNNER_TEMP/quint_evaluator.tar.gz" \
               "https://github.com/informalsystems/quint/releases/download/evaluator/$ver/$asset"
          tar -xzf "$RUNNER_TEMP/quint_evaluator.tar.gz" -C "$dir"
          rm -f "$RUNNER_TEMP/quint_evaluator.tar.gz"
          chmod +x "$dir/quint_evaluator"
          # Fail here if it is missing or unrunnable, rather than 200 build
          # steps later inside somebody else's generator.  --help, not
          # --version: the evaluator rejects the latter and exits 1, which
          # would fail this step on a perfectly good binary.
          test -x "$dir/quint_evaluator"
          "$dir/quint_evaluator" --help > /dev/null
          echo "quint rust evaluator $ver ready at $dir"

      - name: Configure and build
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: 2G
        run: |
          # Counters ride along in the restored cache; zero them so the stats
          # below describe this run alone.
          ccache -z > /dev/null
          cmake -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DSPECS_BUNDLE=ON -DREQUIRE_CTL_MBT=ON \
                -S "${{ github.workspace }}" -B "${{ runner.temp }}/build"
          ninja -C "${{ runner.temp }}/build"
          ccache --show-stats || true

      - name: Test
        run: |
          cd "${{ runner.temp }}/build"
          mkdir -p "${{ github.workspace }}/ctest-results"
          start=$(date +%s)
          rc=0
          "${{ github.workspace }}/scripts/cap_ctest_output.sh" \
            ctest --output-on-failure --test-output-size-failed 65536 \
                  --timeout 300 -j "$(sysctl -n hw.ncpu)" \
                  --output-junit "${{ github.workspace }}/ctest-results/results.xml" || rc=$?
          echo "$(( $(date +%s) - start ))" > "${{ github.workspace }}/ctest-results/duration_seconds"
          exit $rc

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ctest-junit-macos-${{ matrix.build_type }}
          path: ctest-results/
          if-no-files-found: warn
          retention-days: 30

  # macOS static analysis.  Same cached-analyzer driver as the Linux cells; see
  # the static-analysis job above for why scan-build cannot be cached.
  #
  # This was the single most expensive job in the queue -- 611s to 646s of
  # analysis on a three-core hosted runner, on top of everything else -- because
  # scan-build had to do a full uncached instrumented build every time.
  #
  # llvm is still installed: dropping it would silently switch the analyzer to
  # Apple's clang, and keeping the same analyzer the queue has always used is
  # worth 70s of brew.  ccache comes from the same mirror as everywhere else.
  analyze-macos:
    name: Analyze macOS ${{ matrix.build_type }}
    runs-on: macos-14
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        env:
          CCACHE_REF: ghcr.io/chimera-nas/ccache:4.14-darwin
        run: |
          brew update
          # llvm: the analyzer this job has always run.  bison 3.x for the
          # ndrzcc grammar, libxcrypt for full crypt(5) verification.
          # No llvm: scan-build needed it for the analyzer *driver*, but driving
          # `clang --analyze` directly does not.  Dropping it also keeps this
          # job on Apple's clang -- the compiler ccc-analyzer was always
          # actually compiling with, since it invokes whatever `clang` resolves
          # to on PATH and only used brew's LLVM for the analysis pass.  Pinning
          # brew's clang for the whole build instead surfaced a warning Apple's
          # does not have (-Wunused-but-set-global) straight into -Werror.
          brew install cmake ninja bison jansson userspace-rcu rocksdb krb5 \
                       xxhash libxcrypt uthash openssl@3 libnghttp2 oras
          oras pull "${CCACHE_REF}" --output "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/ccache-darwin" /usr/local/bin/ccache
          ccache --version | head -1

      # Written by extended.yml, which runs on main; a merge_group ref is thrown
      # away, so the queue restores but never usefully saves.
      - name: Restore the ccache directory
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-macos-analyze-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-analyze-${{ matrix.build_type }}-

      - name: Run the clang static analyzer
        id: static-analysis
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: 2G
          BUILD_DIR: ${{ runner.temp }}/build-analyze
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/scan-report"
          # Counters ride along in the restored cache; zero them so the stats
          # below describe this run alone.
          ccache -z > /dev/null
          cmake -G Ninja -D CMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                \
                -D CMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -S "$GITHUB_WORKSPACE" -B "$BUILD_DIR"
          # compile_commands.json is not enough on its own: several entries
          # include generated headers, so the tree has to be built first.
          ninja -C "$BUILD_DIR"
          # --exclude ext: the vendored submodules are analysed in their own
          # repos and cannot be fixed from a chimera PR.
          python3 "$GITHUB_WORKSPACE/scripts/analyze_cached.py" \
                  --build-dir "$BUILD_DIR" \
                  --report-dir "$GITHUB_WORKSPACE/scan-report" \
                  --exclude "$GITHUB_WORKSPACE/ext/" \
                  -j "$(sysctl -n hw.ncpu)" \
            2>&1 | tee "$GITHUB_WORKSPACE/scan-report/analyzer-output.txt"
          ccache --show-stats || true

      - name: Upload static analysis report
        if: ${{ failure() && steps.static-analysis.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: analyzer-report-macos-${{ matrix.build_type }}
          path: scan-report/
          if-no-files-found: warn
          retention-days: 30

  # Single stable aggregate of the whole build/test matrix, so the merge
  # queue's required-checks list is one name instead of every matrix cell
  # (and survives matrix changes). Mark this job as a required status check.
  ci-complete:
    name: CI complete
    needs:
      - build-devcontainer
      - build-ubuntu26
      - build-ubuntu24
      - build-ubuntu22
      - build-rocky9
      - build-rocky10
      - test
      - test-dev
      - static-analysis
      - macos
      - analyze-macos
    if: ${{ always() }}
    runs-on: arc-small
    permissions:
      contents: read
    steps:
      - name: Verify all build/test jobs passed
        run: |
          # Every dependency must be `success`.  Checking results rather than
          # using success() means a job that was skipped -- never actually run --
          # cannot pass this for the wrong reason.
          results='${{ join(needs.*.result, ' ') }}'
          echo "dependency results: ${results}"
          for r in ${results}; do
            if [ "$r" != "success" ]; then
              echo "a required job did not succeed"
              exit 1
            fi
          done
