name: Extended
on: workflow_dispatch
permissions:
  contents: read
  packages: read
jobs:
  delegation-repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/fetch-oras
        with:
          arch: amd64
      - name: Diagnose repeated Ubuntu 26.04 delegation recall
        run: |
          mkdir -p ctest-results
          docker run --rm --privileged \
            -e EVPL_IO_URING_ENTRIES=1024 -e CHIMERA_IO_URING_MAX_INFLIGHT=256 \
            -e KVM_NFSTEST_RUNTEST=recall18 -e KVM_PCAP_FILE=/build/delegation.pcap \
            -v "$GITHUB_WORKSPACE/oras:/usr/local/bin/oras:ro" \
            -v "$GITHUB_WORKSPACE:/workspace" -v "$RUNNER_TEMP/build:/build" \
            -w /workspace ghcr.io/chimera-nas/chimera-dev:b407c56cd448ed56820ead48fb5a906df13a1678-amd64 \
            bash -euc '
              cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -DKVM_TESTING=ON -DKVM_FETCH_IMAGES=OFF -S /workspace -B /build/Debug
              ninja -C /build/Debug -j4 chimera kvm_ubuntu2604_image
              rc=0
              ctest --test-dir /build/Debug -C extended -V --repeat until-fail:30 \
                -R "^chimera/kvm/ubuntu2604/nfstest/nfstest_delegation_memfs_nfs4.1$" \
                --output-junit /workspace/ctest-results/delegation.xml || rc=$?
              # Export operation ordering only, never packet payloads or the capture.
              if [ -f /build/delegation.pcap ]; then
                tshark -r /build/delegation.pcap -Y nfs -T fields \
                  -e frame.number -e ip.src -e rpc.xid -e rpc.msgtyp \
                  -e nfs.opcode -e nfs.nfsstat4 > /workspace/ctest-results/operations.tsv
                rm /build/delegation.pcap
              fi
              exit "$rc"
            ' 2>&1 | tee ctest-results/delegation.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: delegation-repro
          path: |
            ctest-results/delegation.log
            ctest-results/delegation.xml
            ctest-results/operations.tsv
