name: Extended
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  fixture-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/fetch-oras
        with:
          arch: amd64
      - name: Exercise remounts and Ubuntu 24.04 HWE pNFS
        run: |
          mkdir -p ctest-results
          docker run --rm --privileged \
            -e EVPL_IO_URING_ENTRIES=1024 \
            -e CHIMERA_IO_URING_MAX_INFLIGHT=256 \
            -v "$GITHUB_WORKSPACE/oras:/usr/local/bin/oras:ro" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/build:/build" \
            -w /workspace \
            ghcr.io/chimera-nas/chimera-dev:9ddac6b366206330fa84c400bb146f511ed999c4-amd64 \
            bash -euc '
              cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DKVM_TESTING=ON -DKVM_FETCH_IMAGES=OFF -S /workspace -B /build/Release
              ninja -C /build/Release -j4 chimera posix_test_diskfs_reclaim posix_test_diskfs_evict kvm_ubuntu2404_hwe_image
              ctest --test-dir /build/Release -C extended -V -j4 --timeout 300 \
                -R "(^chimera/posix/diskfs_(reclaim|evict)_diskfs_(aio|io_uring)$|^chimera/kvm/guest_completion$|^chimera/kvm/ubuntu2404_hwe/pnfs/)" \
                --output-junit /workspace/ctest-results/fixtures.xml
            ' 2>&1 | tee ctest-results/fixtures.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fixture-regressions
          path: ctest-results/
