          cache-from: type=registry,ref=ghcr.io/chimera-nas/chimera-rocky10:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/chimera-nas/chimera-rocky10:buildcache-${{ matrix.arch }},mode=max

  test:
    name: Test ${{ matrix.image_name }} ${{ matrix.arch }} ${{ matrix.build_type }}
    needs: [build-devcontainer, build-ubuntu26, build-ubuntu24, build-ubuntu22, build-rocky9, build-rocky10]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # devcontainer. KVM is required ON for amd64, where the suites
          # actually run, so a regression in availability fails the build
          # rather than silently skipping. The devcontainer ships only x86
          # qemu (qemu-system-x86), so KVM acceleration is unavailable on
          # arm64 -- the suites never ran there, so keep them explicitly OFF.
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-dev
            image_name: devcontainer
            cmake_extra: "-DKVM_TESTING=ON"
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-dev
            image_name: devcontainer
            cmake_extra: "-DKVM_TESTING=ON"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-dev
            image_name: devcontainer
            cmake_extra: "-DKVM_TESTING=OFF"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-dev
            image_name: devcontainer
            cmake_extra: "-DKVM_TESTING=OFF"
          # ubuntu 26 (no KVM here; disable explicitly so a missing /dev/kvm
          # does not get silently auto-detected)
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu26
            image_name: ubuntu26
            cmake_extra: "-DKVM_TESTING=OFF"
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu26
            image_name: ubuntu26
            cmake_extra: "-DKVM_TESTING=OFF"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu26
            image_name: ubuntu26
            cmake_extra: "-DKVM_TESTING=OFF"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu26
            image_name: ubuntu26
            cmake_extra: "-DKVM_TESTING=OFF"
          # ubuntu 24
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu24
            image_name: ubuntu24
            cmake_extra: "-DKVM_TESTING=OFF"
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu24
            image_name: ubuntu24
            cmake_extra: "-DKVM_TESTING=OFF"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu24
            image_name: ubuntu24
            cmake_extra: "-DKVM_TESTING=OFF"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu24
            image_name: ubuntu24
            cmake_extra: "-DKVM_TESTING=OFF"
          # ubuntu 22
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu22
            image_name: ubuntu22
            cmake_extra: "-DIO_URING_ENABLED=OFF -DKVM_TESTING=OFF"
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu22
            image_name: ubuntu22
            cmake_extra: "-DIO_URING_ENABLED=OFF -DKVM_TESTING=OFF"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu22
            image_name: ubuntu22
            cmake_extra: "-DIO_URING_ENABLED=OFF -DKVM_TESTING=OFF"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu22
            image_name: ubuntu22
            cmake_extra: "-DIO_URING_ENABLED=OFF -DKVM_TESTING=OFF"
          # rocky 9 (io_uring disabled: kernel 5.14 + ASAN causes timeouts, see #197)
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky9
            image_name: rocky9
            cmake_extra: "-DIO_URING_ENABLED=OFF -DKVM_TESTING=OFF"
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky9
            image_name: rocky9
            cmake_extra: "-DIO_URING_ENABLED=OFF -DKVM_TESTING=OFF"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky9
            image_name: rocky9
            cmake_extra: "-DIO_URING_ENABLED=OFF -DKVM_TESTING=OFF"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky9
            image_name: rocky9
            cmake_extra: "-DIO_URING_ENABLED=OFF -DKVM_TESTING=OFF"
          # rocky 10
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky10
            image_name: rocky10
            cmake_extra: "-DKVM_TESTING=OFF"
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky10
            image_name: rocky10
            cmake_extra: "-DKVM_TESTING=OFF"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky10
            image_name: rocky10
            cmake_extra: "-DKVM_TESTING=OFF"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky10
            image_name: rocky10
            cmake_extra: "-DKVM_TESTING=OFF"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # A hosted runner has far less disk than the ARC hosts this used to run
      # on, and these images are large; see the action for what it reclaims.
      # The CI images are GHCR packages of this repository, so the pull below
      # is authenticated with the run's own token.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # KVM guest images are pulled from GHCR with oras (see build-test.yml).
      - name: Fetch oras CLI
        uses: ./.github/actions/fetch-oras
        with:
          arch: ${{ matrix.arch }}

      # This workflow is the WRITER for every shared ccache: it runs on a
      # schedule against main, so its save lands in the default-branch scope
      # that a merge-queue run and a PR run can both read.  Restore and save
      # are split rather than using actions/cache, because the save has to
      # carry `if: always()` -- see the end of this job for why.
      - name: Restore the ccache directory
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}-

      - name: Configure, build, and test inside the container
        run: |
          docker run --rm --privileged \
            -e CCACHE_DIR=/ccache \
            -e CCACHE_MAXSIZE \
            -v "${{ runner.temp }}/ccache:/ccache" \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/oras:/usr/local/bin/oras:ro" \
            -v /build \
            -w /build \
            ${{ matrix.image_tag_prefix }}:${{ github.sha }}-${{ matrix.arch }} \
            bash -euxc '
              # ccache keeps its counters inside the cache directory, so a
              # restored cache carries the statistics of the run that made it.
              # Left alone, --show-stats reports both runs summed: the first
              # consumer read showed "945/1894 (49.89%)" for a build that was
              # really 945 of 947, 99.8%.  Zero them so the number means what it
              # looks like it means.
              ccache -z > /dev/null
              cmake -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DREQUIRE_NETNS_TESTS=ON ${{ matrix.cmake_extra }} /workspace
              ninja
              ccache --show-stats || true
              # Trim to the configured ceiling before the save, so the entry
              # the other workflows restore stays a predictable size.
              ccache --trim-max-size ${CCACHE_MAXSIZE} || true
              /workspace/scripts/cap_ctest_output.sh \
              ctest -C extended --output-on-failure --test-output-size-failed 65536 --timeout 300 -j "$(nproc)"'

      # The container runs as root, so everything it wrote into the bind-mounted
      # cache is root-owned and the runner user cannot tar it up.
      - name: Take ownership of the ccache directory
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "${{ runner.temp }}/ccache"

      # Saved even when ctest failed: the cache reflects a build that happened,
      # and withholding it would make every later run pay for a test failure
      # that has nothing to do with compilation.  This is why restore and save
      # are split -- actions/cache saves only on a successful job.
      - name: Save the ccache directory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}-${{ github.sha }}

  # macOS: the extended tier on a GitHub-hosted arm64 runner.  Nothing here is
  # containerised and none of the Linux-only pieces exist (io_uring, libaio,
  # KVM, netns, RDMA, the linux passthrough backend), so this covers the kqueue
  # event core, the in-process test transport, and every portable path above
  # them -- the combination the Linux matrix never exercises.
  #
  # The merge queue runs the quick tier here; this is the only place the rest
  # of the suite meets macOS.
  #
  # No netns and no raised limits on a hosted runner: the in-process suites run
  # gate-free (CHIMERA_LIMITS_TESTING passes vacuously off Linux) and the
  # genuinely networked suites serialize under the chimera_net lock.
  macos:
    name: Test macOS ${{ matrix.build_type }}
    runs-on: macos-14
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          # bison: Apple ships 2.3 and the ndrzcc grammar needs 3.x; the
          # top-level CMakeLists already adds the keg-only Homebrew path.
          # libxcrypt: Darwin libc crypt(3) is DES-only, and REST auth needs
          # full crypt(5) $-scheme verification.
          brew install cmake ninja bison jansson userspace-rcu rocksdb krb5 \
                       xxhash libxcrypt uthash openssl@3 libnghttp2
          # oras, not quint: this job has never had a model-based-test trace
          # corpus, so every MBT replay ctest disabled itself here.  A CI
          # checkout never has local edits to ext/specs, so the bundle the specs
          # CI published for the pinned commit always applies.
          brew install oras

          # Same pinned upstream ccache the Linux images get, from the same
          # mirror.  Upstream's darwin asset is one universal binary, so it
          # covers Intel and Apple Silicon alike.
          oras pull "ghcr.io/chimera-nas/ccache:4.14-darwin" --output "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/ccache-darwin" /usr/local/bin/ccache
          ccache --version | head -1

      # This job is what populates the macOS ccache for everything else.
      # Actions caches are branch-scoped, and build-test.yml only runs on
      # merge_group, whose ref is thrown away -- so a queue run can restore but
      # never usefully save.  This one runs on a schedule against main, so its
      # save lands in the default-branch scope that every other run can read.
      - name: Restore the ccache directory
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-macos-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-${{ matrix.build_type }}-

      # quint from the mirrored darwin payload rather than the npm registry and
      # the GitHub releases endpoint.  Only the Rust evaluator is platform
      # specific -- quint itself is JavaScript -- so this is the same tree the
      # Linux images get, plus the darwin evaluator, pre-placed where quint
      # looks for it.
      #
      # That pre-placement is a gate, not a nicety.  quint's default rust
      # backend fetches the evaluator on first use and ABORTS rather than
      # falling back to its interpreter when the fetch fails; a merge-queue run
      # has already died that way on an anonymous, rate-limited releases API
      # call, and the run after it found a half-written ~/.quint and died in
      # chmod.  Nothing is fetched at job time now.
      - name: Install quint from the mirrored payload
        run: |
          set -euo pipefail
          # Pinned by ext/specs/.quint-version, not hardcoded here: trace
          # generation is seeded and reproducible for a given quint release,
          # and that file is what records the release the corpus was generated
          # against.  The mirrored tag follows it.
          qver=$(tr -d '[:space:]' < ext/specs/.quint-version)
          oras pull "ghcr.io/chimera-nas/quint:${qver}-darwin" \
               --output "${RUNNER_TEMP}/quint-dl"
          mkdir -p "${RUNNER_TEMP}/quint"
          tar -xzf "${RUNNER_TEMP}/quint-dl/quint-darwin.tar.gz" \
              -C "${RUNNER_TEMP}/quint"
          ver=$(cat "${RUNNER_TEMP}/quint/evaluator-version")
          case "$(uname -m)" in
            arm64|aarch64) ev=quint_evaluator-aarch64 ;;
            x86_64)        ev=quint_evaluator-x86_64 ;;
            *) echo "no quint evaluator for $(uname -m)" >&2; exit 1 ;;
          esac
          dir="$HOME/.quint/rust-evaluator-$ver"
          mkdir -p "$dir"
          install -m 0755 "${RUNNER_TEMP}/quint/rust-evaluator-$ver/$ev" \
                  "$dir/quint_evaluator"
          echo "${RUNNER_TEMP}/quint/quint/bin" >> "$GITHUB_PATH"
          # --help, not --version: the evaluator rejects the latter and exits 1.
          "$dir/quint_evaluator" --help > /dev/null
          "${RUNNER_TEMP}/quint/quint/bin/quint" --version

      - name: Configure and build
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: 2G
        run: |
          # Counters ride along in the restored cache; zero them so the stats
          # below describe this run alone.
          ccache -z > /dev/null
          cmake -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DSPECS_BUNDLE=ON \
                -S "${{ github.workspace }}" -B "${{ runner.temp }}/build"
          ninja -C "${{ runner.temp }}/build"
          ccache --show-stats || true

      - name: Test
        run: |
          cd "${{ runner.temp }}/build"
          "${{ github.workspace }}/scripts/cap_ctest_output.sh" \
            ctest -C extended --output-on-failure --test-output-size-failed 65536 \
                  --timeout 300 -j "$(sysctl -n hw.ncpu)"

  # Informational measurement of the full smbtorture smb2 matrix (655 subtests x
  # 6 VFS backends).  The gating suite only registers the subtests in the
  # generated SMBTORTURE_ENABLED_<backend> allowlists, so 15-30% of the catalog
  # per backend never runs in CI at all; this job runs the complement too and
  # diffs the outcome against the checked-in baseline.
  #
  # It fails ONLY on a "newly failing" cell -- a subtest that is in the baseline
  # (and therefore gated) but did not pass.  A "still failing" cell is the
  # expected state of the exploration backlog and must not be noise, or the job
  # would be red every night and nobody would read it.
  #
  # amd64 Release only: the matrix is ~3900 daemon+netns+client invocations and
  # the baselines were measured on that configuration.
  # Writer for the macOS analysis ccache.  build-test.yml's analyze-macos runs
  # only in the merge queue, whose ref is discarded, so it can restore but never
  # usefully save; this job runs on a schedule against main and populates the
  # default-branch scope it reads from.
  analyze-macos:
    name: Analyze macOS ${{ matrix.build_type }}
    runs-on: macos-14
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        env:
          CCACHE_REF: ghcr.io/chimera-nas/ccache:4.14-darwin
        run: |
          brew update
          # No llvm: scan-build needed it for the analyzer *driver*, but driving
          # `clang --analyze` directly does not.  Dropping it also keeps this
          # job on Apple's clang -- the compiler ccc-analyzer was always
          # actually compiling with, since it invokes whatever `clang` resolves
          # to on PATH and only used brew's LLVM for the analysis pass.  Pinning
          # brew's clang for the whole build instead surfaced a warning Apple's
          # does not have (-Wunused-but-set-global) straight into -Werror.
          brew install cmake ninja bison jansson userspace-rcu rocksdb krb5 \
                       xxhash libxcrypt uthash openssl@3 libnghttp2 oras
          oras pull "${CCACHE_REF}" --output "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/ccache-darwin" /usr/local/bin/ccache
          ccache --version | head -1

      - name: Restore and save the ccache directory
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-macos-analyze-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-analyze-${{ matrix.build_type }}-

      - name: Run the clang static analyzer
        id: static-analysis
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: 2G
          BUILD_DIR: ${{ runner.temp }}/build-analyze
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/scan-report"
          # Counters ride along in the restored cache; zero them so the stats
          # below describe this run alone.
          ccache -z > /dev/null
          cmake -G Ninja -D CMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                \
                -D CMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -S "$GITHUB_WORKSPACE" -B "$BUILD_DIR"
          ninja -C "$BUILD_DIR"
          python3 "$GITHUB_WORKSPACE/scripts/analyze_cached.py" \
                  --build-dir "$BUILD_DIR" \
                  --report-dir "$GITHUB_WORKSPACE/scan-report" \
                  --exclude "$GITHUB_WORKSPACE/ext/" \
                  -j "$(sysctl -n hw.ncpu)" \
            2>&1 | tee "$GITHUB_WORKSPACE/scan-report/analyzer-output.txt"
          ccache --show-stats || true

      - name: Upload static analysis report
        if: ${{ failure() && steps.static-analysis.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: analyzer-report-macos-${{ matrix.build_type }}
          path: scan-report/
          if-no-files-found: warn
          retention-days: 30

  smbtorture-matrix:
    name: smbtorture matrix (informational)
    needs: [build-devcontainer]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    # Passing cells cost ~0.6s, but a hung cell burns the full 300s timeout and
    # there are ~880 non-passing cells across the matrix; 3h leaves headroom.
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # A hosted runner has far less disk than the ARC hosts this used to run
      # on, and these images are large; see the action for what it reclaims.
      # The CI images are GHCR packages of this repository, so the pull below
      # is authenticated with the run's own token.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --privileged: the netns wrapper needs CAP_NET_ADMIN.  smbtorture itself
      # ships in the devcontainer image (samba-testsuite).
      # The matrix and both compare passes run in the container (which is where
      # python3 and smbtorture live); the runner steps only read the files it
      # leaves behind, so publishing never depends on tooling outside the image.
      #
      # compare runs twice over the same results: once to render the buckets for
      # the job summary, once to decide the exit status.  The verdict is recorded
      # as a flag file rather than failing here, so the summary and the artifacts
      # still publish when a gated test regressed -- exactly when they are worth
      # reading.  "still failing" is summarized but not listed; it is ~880 cells
      # of known backlog.
      # The scoping inputs reach regen.sh as environment variables passed through
      # by `docker run -e NAME` (value taken from the step env), never
      # interpolated into the container's command line -- a dispatch input is
      # attacker-controlled text and must not be able to break out of quoting.
      # Empty means the full matrix, which is what the scheduled run sends.
      #
      # compare measures against measured-catalog.txt -- the catalog the run
      # actually covered -- and not the checked-in SMBTORTURE_SUITES.  Identical
      # for a full run today; they diverge as soon as a dispatch scopes the
      # matrix or a Samba upgrade changes the catalog, and then the live one is
      # the honest denominator.  regen.sh writes that file on every run, scoped
      # or not, so nothing here has to infer the scope from which files exist.
      #
      # report.py runs last, after the verdict flag is settled: it renders the
      # same results into one self-contained HTML file, so the artifact carries
      # a path from a named cell down to the log that explains it rather than
      # ~880 loose smbt-fail.*.log files.  Last on purpose -- everything ahead
      # of it in the chain either publishes or decides the exit status, and a
      # rendering failure must not be able to skip the regression verdict.
      # It exits non-zero only when it genuinely could not read the results or
      # write the page (a regression is still a 0), so && is the same contract
      # the drift.md render above already runs under.
      #
      # safe.directory: the page stamps the revision of the baseline it judged
      # against, which is the whole defence against an old results set read
      # against newer allowlists.  /workspace is checked out by the runner and
      # the container is root, so without this git refuses the repo as dubious
      # ownership and the stamp silently degrades to "unknown revision" --
      # exactly the unlabelled report the stamp exists to prevent.
      - name: Build and run the matrix
        env:
          SMBTORTURE_BACKENDS: ${{ inputs.smbtorture_backends }}
          SMBTORTURE_FILTER: ${{ inputs.smbtorture_filter }}
          SMBTORTURE_PARALLEL: ${{ inputs.smbtorture_parallel || '32' }}
        run: |
          rm -rf smbt-report
          mkdir -p smbt-report
          docker run --rm --privileged \
            -e SMBTORTURE_BACKENDS \
            -e SMBTORTURE_FILTER \
            -e SMBTORTURE_PARALLEL \
            -v "${{ github.workspace }}:/workspace" \
            -v /build \
            -w /build \
            ${{ env.DEV_IMAGE_TAG_PREFIX }}:${{ github.sha }}-amd64 \
            bash -euxc '\
              cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DREQUIRE_NETNS_TESTS=ON /workspace && \
              ninja smbtorture_test && \
              /workspace/tools/smbtorture/regen.sh --report-only \
                  --build-dir /build \
                  --out-dir /workspace/smbt-report && \
              cd /workspace && \
              python3 tools/smbtorture/regen.py compare \
                  --results smbt-report/results.txt \
                  --cmake src/server/smb/tests/CMakeLists.txt \
                  --subs smbt-report/measured-catalog.txt \
                  --format markdown \
                  --quiet-buckets "still failing" \
                > smbt-report/drift.md && \
              { python3 tools/smbtorture/regen.py compare \
                  --results smbt-report/results.txt \
                  --cmake src/server/smb/tests/CMakeLists.txt \
                  --subs smbt-report/measured-catalog.txt \
                  --quiet-buckets "still failing,skipped" \
                  --fail-on-newly-failing > /dev/null \
                || touch smbt-report/newly-failing.flag; } && \
              git config --global --add safe.directory /workspace && \
              python3 tools/smbtorture/report.py \
                  --results smbt-report/results.txt \
                  --cmake src/server/smb/tests/CMakeLists.txt \
                  --output smbt-report/report.html'

      - name: Report baseline drift
        if: always()
        run: |
          if [ -f smbt-report/drift.md ]; then
            {
              echo '## smbtorture baseline drift'
              cat smbt-report/drift.md
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## smbtorture baseline drift' >> "$GITHUB_STEP_SUMMARY"
            echo 'The matrix did not complete; no results to compare.' >> "$GITHUB_STEP_SUMMARY"
          fi
          # The buckets above name the cells but cannot show why any of them
          # failed.  A step summary cannot link to a file inside an artifact,
          # so name the artifact and let the reader download it.
          if [ -f smbt-report/report.html ]; then
            {
              echo
              echo 'Browsable per-cell report: `report.html` in the `smbtorture-matrix-amd64` artifact.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload matrix results and failure logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smbtorture-matrix-amd64
          path: smbt-report/
          if-no-files-found: warn
          retention-days: 30

      # Only a regression in a gated subtest turns the job red.  A missing flag
      # file means either no regression or a matrix that never finished, and the
      # latter already failed its own step.
      - name: Fail on a regression in a gated subtest
        if: always()
        run: |
          if [ -f smbt-report/newly-failing.flag ]; then
            echo "a gated smbtorture subtest regressed; see the job summary" >&2
            exit 1
          fi

  static-analysis:
    name: Analyze ${{ matrix.image_name }} ${{ matrix.arch }} ${{ matrix.build_type }}
    needs: [build-devcontainer, build-ubuntu26, build-ubuntu24, build-ubuntu22, build-rocky9, build-rocky10]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # devcontainer
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-dev
            image_name: devcontainer
            cmake_extra: ""
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-dev
            image_name: devcontainer
            cmake_extra: ""
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu26
            image_name: ubuntu26
            cmake_extra: ""
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu26
            image_name: ubuntu26
            cmake_extra: ""
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu24
            image_name: ubuntu24
            cmake_extra: ""
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu24
            image_name: ubuntu24
            cmake_extra: ""
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu22
            image_name: ubuntu22
            cmake_extra: "-DIO_URING_ENABLED=OFF"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu22
            image_name: ubuntu22
            cmake_extra: "-DIO_URING_ENABLED=OFF"
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky9
            image_name: rocky9
            cmake_extra: "-DIO_URING_ENABLED=OFF"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky9
            image_name: rocky9
            cmake_extra: "-DIO_URING_ENABLED=OFF"
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky10
            image_name: rocky10
            cmake_extra: ""
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky10
            image_name: rocky10
            cmake_extra: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # A hosted runner has far less disk than the ARC hosts this used to run
      # on, and these images are large; see the action for what it reclaims.
      # The CI images are GHCR packages of this repository, so the pull below
      # is authenticated with the run's own token.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This workflow is the WRITER for every shared ccache: it runs on a
      # schedule against main, so its save lands in the default-branch scope
      # that a merge-queue run and a PR run can both read.  Restore and save
      # are split rather than using actions/cache, because the save has to
      # carry `if: always()` -- see the end of this job for why.
      - name: Restore the ccache directory
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-analyze-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-analyze-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}-

      # Drives the analyzer per TU instead of through scan-build, so the results
      # are cacheable.  See build-test.yml for why scan-build cannot be.
      - name: Run the clang static analyzer
        id: static-analysis
        run: |
          set -o pipefail
          mkdir -p "${{ github.workspace }}/scan-report"
          docker run --rm --privileged \
            -e CCACHE_DIR=/ccache \
            -e CCACHE_MAXSIZE \
            -v "${{ runner.temp }}/ccache:/ccache" \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/scan-report:/scan-report" \
            -v /build \
            -w /build \
            ${{ matrix.image_tag_prefix }}:${{ github.sha }}-${{ matrix.arch }} \
            bash -euxc '
              # ccache keeps its counters inside the cache directory, so a
              # restored cache carries the statistics of the run that made it.
              # Left alone, --show-stats reports both runs summed: the first
              # consumer read showed "945/1894 (49.89%)" for a build that was
              # really 945 of 947, 99.8%.  Zero them so the number means what it
              # looks like it means.
              ccache -z > /dev/null
              cmake -D CMAKE_BUILD_TYPE=${{ matrix.build_type }} -D CMAKE_C_COMPILER=clang -D CMAKE_EXPORT_COMPILE_COMMANDS=ON -D IO_URING_NVME_ENABLED=OFF ${{ matrix.cmake_extra }} -B /build -S /workspace -G Ninja
              ninja -C /build
              python3 /workspace/scripts/analyze_cached.py \
                      --build-dir /build --report-dir /scan-report \
                      --exclude /workspace/ext/ -j "$(nproc)"
              ccache --show-stats || true
              # Trimmed AFTER the analyzer, not between the build and it.  The
              # entries that cost anything to recompute are the --analyze ones,
              # and they do not exist yet at that point: an early trim once
              # published a cache holding only the compile entries, and the
              # first consumer of it hit on every compile and missed on all 838
              # analyses.  || true because the trim is best-effort.
              ccache --trim-max-size ${CCACHE_MAXSIZE} || true' \
            2>&1 | tee "${{ github.workspace }}/scan-report/analyzer-output.txt"

      # The container runs as root, so everything it wrote into the bind-mounted
      # cache is root-owned and the runner user cannot tar it up.
      - name: Take ownership of the ccache directory
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "${{ runner.temp }}/ccache"

      # Saved even when ctest failed: the cache reflects a build that happened,
      # and withholding it would make every later run pay for a test failure
      # that has nothing to do with compilation.  This is why restore and save
      # are split -- actions/cache saves only on a successful job.
      - name: Save the ccache directory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-analyze-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}-${{ github.sha }}

      - name: Upload static analysis report
        if: ${{ failure() && steps.static-analysis.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: analyzer-report-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}
          path: scan-report/
          if-no-files-found: warn
          retention-days: 30
