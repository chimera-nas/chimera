name: Extended

on:
  schedule:
    # Every six hours rather than once a day.  This workflow no longer writes
    # any shared cache -- build-test.yml's push-to-main run does that, on every
    # merge, which keeps the entries far closer to the tip than any cron could.
    # What the cadence buys now is discovery latency on the extended tier
    # itself: four sweeps a day means a break in pynfs, smbtorture, wpts or the
    # KVM suites surfaces within hours of the merge that caused it rather than
    # the following morning.
    - cron: '0 1,7,13,19 * * *'  # 01:00, 07:00, 13:00, 19:00 UTC
  workflow_dispatch:     # allow manual runs
    # Scope the smbtorture matrix for a manual run.  All three default to the
    # full matrix, so the scheduled run is unaffected; they exist so the job can
    # be exercised end to end (privileged container, netns, artifact upload, job
    # summary, regression gate) in a minute rather than the hours a full ~3900
    # cell sweep takes.  Ignored by every other job.
    inputs:
      smbtorture_backends:
        description: 'smbtorture: backends to run (default: all six)'
        required: false
        type: string
      smbtorture_filter:
        description: 'smbtorture: only subtests matching this regex (default: all)'
        required: false
        type: string
      smbtorture_parallel:
        description: 'smbtorture: concurrent cells'
        required: false
        type: string
        default: '32'

env:
  DEV_IMAGE_TAG_PREFIX: ghcr.io/chimera-nas/chimera-dev
  U26_IMAGE_TAG_PREFIX: ghcr.io/chimera-nas/chimera-ubuntu26
  U24_IMAGE_TAG_PREFIX: ghcr.io/chimera-nas/chimera-ubuntu24
  U22_IMAGE_TAG_PREFIX: ghcr.io/chimera-nas/chimera-ubuntu22
  R9_IMAGE_TAG_PREFIX: ghcr.io/chimera-nas/chimera-rocky9
  R10_IMAGE_TAG_PREFIX: ghcr.io/chimera-nas/chimera-rocky10
  # The mirrored ccache binary, the quint toolchain and the KVM guest images
  # come straight from their public GHCR packages -- the defaults already
  # compiled into the Dockerfiles and into kvm/CMakeLists.txt.  The overrides
  # that used to sit here pointed at an internal pull-through proxy, which a
  # GitHub-hosted runner cannot reach.
  #
  # This workflow only ever READS the shared ccache.  build-test.yml's
  # push-to-main run is the sole writer: it saves on refs/heads/main, the
  # default-branch scope every other run restores from, and it publishes on
  # every merge rather than on this cron, so the entries track the tip.
  #
  # A save from here would be worse than useless.  It would land in this
  # workflow's own cache scope, where the queue and PR runs cannot read it,
  # while still consuming the repository's 10 GB allowance and evicting the
  # entries that ARE readable.
  #
  # CCACHE_MAXSIZE still applies: it bounds each cell's local cache during the
  # run.  Nothing here saves that cache, so the ceiling costs nothing, but a
  # restored entry that grew unbounded would still be slower to unpack.
  #
  # Note the arm64 distro cells below restore keys nobody writes: build-test's
  # distro matrix is amd64-only, so ubuntu22/24/26 and rocky9/10 on arm64 build
  # cold here.  If that ever costs more than it is worth, the fix is to widen
  # the push-to-main matrix, not to start saving from this workflow.
  CCACHE_MAXSIZE: 2G

jobs:
  build-devcontainer:
    name: Build devcontainer ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the dev container image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.DEV_IMAGE_TAG_PREFIX }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=ghcr.io/chimera-nas/chimera-dev:buildcache-${{ matrix.arch }}
          # No cache-to.  This workflow is a pure consumer now: the shared
          # layer cache is published by the push-to-main run of
          # build-test.yml, which is the ref every other run can read.
          build-args: |
            UBUNTU_MIRROR=azure

  build-ubuntu26:
    name: Build ubuntu26 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the ubuntu26 CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ubuntu26.04
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.U26_IMAGE_TAG_PREFIX }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=ghcr.io/chimera-nas/chimera-ubuntu26:buildcache-${{ matrix.arch }}

          build-args: |
            UBUNTU_MIRROR=azure

  build-ubuntu24:
    name: Build ubuntu24 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the ubuntu24 CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ubuntu24.04
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.U24_IMAGE_TAG_PREFIX }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=ghcr.io/chimera-nas/chimera-ubuntu24:buildcache-${{ matrix.arch }}

          build-args: |
            UBUNTU_MIRROR=azure

  build-ubuntu22:
    name: Build ubuntu22 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the ubuntu22 CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ubuntu22.04
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.U22_IMAGE_TAG_PREFIX }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=ghcr.io/chimera-nas/chimera-ubuntu22:buildcache-${{ matrix.arch }}

          build-args: |
            UBUNTU_MIRROR=azure

  build-rocky9:
    name: Build rocky9 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the rocky9 CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.rocky9
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.R9_IMAGE_TAG_PREFIX }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=ghcr.io/chimera-nas/chimera-rocky9:buildcache-${{ matrix.arch }}

          build-args: |
            UBUNTU_MIRROR=azure

  build-rocky10:
    name: Build rocky10 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the rocky10 CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.rocky10
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.R10_IMAGE_TAG_PREFIX }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=ghcr.io/chimera-nas/chimera-rocky10:buildcache-${{ matrix.arch }}

          build-args: |
            UBUNTU_MIRROR=azure

  test:
    name: Test ${{ matrix.image_name }} ${{ matrix.arch }} ${{ matrix.build_type }}
    needs: [build-devcontainer, build-ubuntu26, build-ubuntu24, build-ubuntu22, build-rocky9, build-rocky10]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The devcontainer image is NOT in this combined matrix: its extended
          # run is sharded by test category in the test-dev job below.  See there
          # for why.
          # ubuntu 26 (no KVM here; disable explicitly so a missing /dev/kvm
          # does not get silently auto-detected)
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu26
            image_name: ubuntu26
            cmake_extra: "-DKVM_TESTING=OFF"
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu26
            image_name: ubuntu26
            cmake_extra: "-DKVM_TESTING=OFF"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu26
            image_name: ubuntu26
            cmake_extra: "-DKVM_TESTING=OFF"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu26
            image_name: ubuntu26
            cmake_extra: "-DKVM_TESTING=OFF"
          # ubuntu 24
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu24
            image_name: ubuntu24
            cmake_extra: "-DKVM_TESTING=OFF"
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu24
            image_name: ubuntu24
            cmake_extra: "-DKVM_TESTING=OFF"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu24
            image_name: ubuntu24
            cmake_extra: "-DKVM_TESTING=OFF"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu24
            image_name: ubuntu24
            cmake_extra: "-DKVM_TESTING=OFF"
          # ubuntu 22
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu22
            image_name: ubuntu22
            cmake_extra: "-DIO_URING_ENABLED=OFF -DKVM_TESTING=OFF"
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu22
            image_name: ubuntu22
            cmake_extra: "-DIO_URING_ENABLED=OFF -DKVM_TESTING=OFF"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu22
            image_name: ubuntu22
            cmake_extra: "-DIO_URING_ENABLED=OFF -DKVM_TESTING=OFF"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-ubuntu22
            image_name: ubuntu22
            cmake_extra: "-DIO_URING_ENABLED=OFF -DKVM_TESTING=OFF"
          # rocky 9 (io_uring disabled: kernel 5.14 + ASAN causes timeouts, see #197)
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky9
            image_name: rocky9
            cmake_extra: "-DIO_URING_ENABLED=OFF -DKVM_TESTING=OFF"
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky9
            image_name: rocky9
            cmake_extra: "-DIO_URING_ENABLED=OFF -DKVM_TESTING=OFF"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky9
            image_name: rocky9
            cmake_extra: "-DIO_URING_ENABLED=OFF -DKVM_TESTING=OFF"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky9
            image_name: rocky9
            cmake_extra: "-DIO_URING_ENABLED=OFF -DKVM_TESTING=OFF"
          # rocky 10
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky10
            image_name: rocky10
            cmake_extra: "-DKVM_TESTING=OFF"
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky10
            image_name: rocky10
            cmake_extra: "-DKVM_TESTING=OFF"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Release
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky10
            image_name: rocky10
            cmake_extra: "-DKVM_TESTING=OFF"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            build_type: Debug
            image_tag_prefix: ghcr.io/chimera-nas/chimera-rocky10
            image_name: rocky10
            cmake_extra: "-DKVM_TESTING=OFF"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # A hosted runner has far less disk than the ARC hosts this used to run
      # on, and these images are large; see the action for what it reclaims.
      # The CI images are GHCR packages of this repository, so the pull below
      # is authenticated with the run's own token.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # KVM guest images are pulled from GHCR with oras (see build-test.yml).
      - name: Fetch oras CLI
        uses: ./.github/actions/fetch-oras
        with:
          arch: ${{ matrix.arch }}

      # Restore only.  This workflow is a pure consumer of the shared ccache:
      # build-test.yml's push-to-main run is the sole writer, and an entry
      # saved from here would land in this workflow's own scope where the
      # queue and PR runs could not read it anyway.
      - name: Restore the ccache directory
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v2-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-${{ matrix.image_name }}-${{ matrix.arch }}-${{ matrix.build_type }}-

      - name: Configure, build, and test inside the container
        run: |
          docker run --rm --privileged \
            -e CCACHE_DIR=/ccache \
            -e CCACHE_MAXSIZE \
            # Ring depth for the io_uring event core -- see the same setting in
            # test-dev below.  This job runs the whole suite under ctest -j nproc,
            # so it stacks rings the same way.
            -e EVPL_IO_URING_ENTRIES=1024 \
            -v "${{ runner.temp }}/ccache:/ccache" \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/oras:/usr/local/bin/oras:ro" \
            -v /build \
            -w /build \
            ${{ matrix.image_tag_prefix }}:${{ github.sha }}-${{ matrix.arch }} \
            bash -euxc '
              # ccache keeps its counters inside the cache directory, so a
              # restored cache carries the statistics of the run that made it.
              # Left alone, --show-stats reports both runs summed: the first
              # consumer read showed "945/1894 (49.89%)" for a build that was
              # really 945 of 947, 99.8%.  Zero them so the number means what it
              # looks like it means.
              ccache -z > /dev/null
              cmake -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DREQUIRE_NETNS_TESTS=ON ${{ matrix.cmake_extra }} /workspace
              ninja
              ccache --show-stats || true
              /workspace/scripts/cap_ctest_output.sh \
              ctest -C extended --output-on-failure --test-output-size-failed 65536 --timeout 300 -j "$(nproc)"'


  # Devcontainer extended run: build once per cell, then shard the tests by
  # category.
  #
  # This is the shape build-test.yml carried before the quick/extended tier
  # split collapsed it (0ec73987, "split the devcontainer into build +
  # per-category test shards").  It is worth restoring because the runners
  # changed underneath it: the devcontainer carries by far the widest test set
  # -- it is the only image with pynfs, smbtorture, wpts, the KVM guests and
  # the full quint corpus -- and running all of it in one job on a four-vCPU
  # hosted runner takes hours of wall clock, serialised behind itself.
  #
  # The shards do not rebuild.  Rebuilding per category would multiply the
  # compile by the number of shards, which on a capped concurrency budget costs
  # more than the serialisation it removes, so build-dev tars the tree once per
  # (arch, build_type) and each shard unpacks it.  Retention is a day: these
  # artifacts exist only to cross the job boundary.
  build-dev:
    name: Build devcontainer ${{ matrix.arch }} ${{ matrix.build_type }}
    needs: [build-devcontainer]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # KVM_FETCH_IMAGES=OFF: the guest images are ~3.4 GB each and land in
          # /kvm, outside the build tree this job tars, so fetching them here
          # downloads several GB that the artifact then excludes.  The kvm
          # shard fetches them on demand instead -- the split kvm/CMakeLists.txt
          # documents, and the same pairing build-test.yml's test-dev uses.
          - { arch: amd64, runner: ubuntu-24.04,     build_type: Release, kvm_cmake: "-DKVM_TESTING=ON -DKVM_FETCH_IMAGES=OFF" }
          - { arch: amd64, runner: ubuntu-24.04,     build_type: Debug,   kvm_cmake: "-DKVM_TESTING=ON -DKVM_FETCH_IMAGES=OFF" }
          - { arch: arm64, runner: ubuntu-24.04-arm, build_type: Release, kvm_cmake: "-DKVM_TESTING=OFF" }
          - { arch: arm64, runner: ubuntu-24.04-arm, build_type: Debug,   kvm_cmake: "-DKVM_TESTING=OFF" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch oras CLI
        uses: ./.github/actions/fetch-oras
        with:
          arch: ${{ matrix.arch }}

      - name: Restore the ccache directory
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v2-devcontainer-${{ matrix.arch }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-devcontainer-${{ matrix.arch }}-${{ matrix.build_type }}-

      - name: Configure and build inside the container
        run: |
          docker run --rm --privileged \
            -e CCACHE_DIR=/ccache \
            -e CCACHE_MAXSIZE \
            -v "${{ runner.temp }}/ccache:/ccache" \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/oras:/usr/local/bin/oras:ro" \
            -v /build \
            -w /build \
            ${{ env.DEV_IMAGE_TAG_PREFIX }}:${{ github.sha }}-${{ matrix.arch }} \
            bash -euxc '
              ccache -z > /dev/null
              cmake -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DREQUIRE_NETNS_TESTS=ON ${{ matrix.kvm_cmake }} /workspace
              ninja
              ccache --show-stats || true
              # Ship the build tree to the test shards (minus the local ccache;
              # KVM guest images live under /kvm, outside /build, so they are
              # already excluded).
              tar -C /build --exclude=./ccache -czf /workspace/build-dev.tar.gz .'

      - name: Upload build tree
        uses: actions/upload-artifact@v4
        with:
          name: build-dev-${{ matrix.arch }}-${{ matrix.build_type }}
          path: build-dev.tar.gz
          retention-days: 1

  test-dev:
    name: Test devcontainer ${{ matrix.arch }} ${{ matrix.build_type }} ${{ matrix.category }}
    needs: [build-dev]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        build_type: [Release, Debug]
        # One shard per label family.  `rest` is the complement of the others,
        # so every extended test lands in exactly one shard and nothing is
        # silently dropped when a family is added -- a new label with no shard
        # of its own still runs, in `rest`.
        category: [pynfs, smbtorture, wpts, pjd, posix, s3, quint, pnfs, kvm, rest]
        include:
          - { arch: amd64, runner: ubuntu-24.04     }
          - { arch: arm64, runner: ubuntu-24.04-arm }
        exclude:
          # The devcontainer ships only qemu-system-x86, so KVM acceleration
          # is unavailable on arm64 and the guests never ran there.
          - { arch: arm64, category: kvm }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The KVM shard fetches guest images from GHCR with oras; the others do
      # not, but the mount is uniform so the command below stays one shape.
      - name: Fetch oras CLI
        uses: ./.github/actions/fetch-oras
        with:
          arch: ${{ matrix.arch }}

      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: build-dev-${{ matrix.arch }}-${{ matrix.build_type }}

      - name: Unpack and run the category
        run: |
          docker run --rm --privileged \
            -e CATEGORY=${{ matrix.category }} \
            # Ring depth for the io_uring event core.  The default 8192
            # entries cost ~1.5 MB of kernel-accounted memory per ring
            # (SQE128/CQE32 double both entry sizes) and SQPOLL adds a kernel
            # thread each; ctest -j nproc runs many multi-threaded chimera
            # processes at once, which is enough to be refused with ENOMEM and
            # lose unrelated tests to a fatal ring allocation.  Ask for a ring
            # sized to a test rather than to a server.
            -e EVPL_IO_URING_ENTRIES=1024 \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/oras:/usr/local/bin/oras:ro" \
            -v /build \
            -w /build \
            ${{ env.DEV_IMAGE_TAG_PREFIX }}:${{ github.sha }}-${{ matrix.arch }} \
            bash -euxc '
              tar -C /build -xzf /workspace/build-dev.tar.gz
              # ctest -L takes a REGEX, not a literal label, so every
              # selector here is anchored.  Unanchored, "-L posix" also matches
              # posix_mbt and "-L s3" matches s3_mbt -- the quint corpus -- so
              # those tests would run in two shards and be excluded from `rest`
              # twice over.  Measured on a real configure: -L posix selected 11
              # tests, -L "^posix$" selected 0.
              #
              # EXCL is the same anchored set, so `rest` is exactly the
              # complement: every extended test lands in one shard, and a label
              # that does not exist on this platform simply leaves its shard
              # empty without stranding anything -- the -LE cannot exclude what
              # is not there.
              EXCL="^pynfs$|^smbtorture$|^wpts$|^pjdfstest$|^posix$|^s3$|^quint$|^pnfs$|^kvm$"
              case "$CATEGORY" in
                pynfs)      SEL="-L ^pynfs$" ;;
                smbtorture) SEL="-L ^smbtorture$" ;;
                wpts)       SEL="-L ^wpts$" ;;
                pjd)        SEL="-L ^pjdfstest$" ;;
                # pjd tests carry both labels; keep them in one shard only.
                posix)      SEL="-L ^posix$ -LE ^pjdfstest$" ;;
                s3)         SEL="-L ^s3$" ;;
                # The pnfs MBT batches carry `quint` too, and the KVM pnfs
                # guests carry `kvm`; peel them off in a fixed order so each
                # test lands in exactly one shard: kvm wins over pnfs, pnfs
                # wins over quint.
                quint)      SEL="-L ^quint$ -LE ^pnfs$" ;;
                pnfs)       SEL="-L ^pnfs$ -LE ^kvm$" ;;
                kvm)        SEL="-L ^kvm$" ;;
                rest)       SEL="-LE $EXCL" ;;
                *)          echo "unknown category $CATEGORY" >&2; exit 1 ;;
              esac
              # The build job left the guest images unfetched (see build-dev),
              # and they live in /kvm outside the tree unpacked above, so the
              # kvm shard has none.  Fetch exactly the images this configure
              # declares rather than a hardcoded list: the previous incarnation
              # of this job named three, kvm/CMakeLists.txt now builds four, and
              # a list that drifts silently fetches the wrong set.
              if [ "$CATEGORY" = kvm ]; then
                imgs=$(ninja -t targets all 2>/dev/null \
                       | grep -oE "^kvm_[a-z0-9_]+_image" | sort -u)
                if [ -z "$imgs" ]; then
                  echo "::error::kvm shard: no kvm_*_image targets in this build"
                  exit 1
                fi
                ninja $imgs
              fi
              # An empty shard is reported, not failed.  It means the label is
              # absent on this platform (pynfs and the KVM guests are not built
              # everywhere), and `rest` picks up anything unlabelled anyway, so
              # nothing is lost -- but a shard that silently runs zero tests is
              # worth seeing in the log.
              if [ "$(ctest -C extended -N $SEL | tail -1 | grep -oE "[0-9]+" | tail -1)" = "0" ]; then
                echo "::notice::category $CATEGORY selected no tests on ${{ matrix.arch }}"
                exit 0
              fi
              mkdir -p /workspace/ctest-results
              /workspace/scripts/cap_ctest_output.sh \
              ctest -C extended $SEL --output-on-failure --test-output-size-failed 65536 --timeout 300 -j "$(nproc)" \
                    --output-junit /workspace/ctest-results/$CATEGORY.xml'

      # A shard that fails is a shard someone has to diagnose, and the console
      # log caps per-test output at 64 KB -- which is how a timeout arrives with
      # its own reason truncated away.  The JUnit carries the full per-test
      # record.  if: always() because a failing shard is exactly the one whose
      # results are worth keeping.
      - name: Upload ctest results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ctest-devcontainer-${{ matrix.arch }}-${{ matrix.build_type }}-${{ matrix.category }}
          path: ctest-results/
          if-no-files-found: warn
          retention-days: 7


  # macOS: the extended tier on a GitHub-hosted arm64 runner.  Nothing here is
  # containerised and none of the Linux-only pieces exist (io_uring, libaio,
  # KVM, netns, RDMA, the linux passthrough backend), so this covers the kqueue
  # event core, the in-process test transport, and every portable path above
  # them -- the combination the Linux matrix never exercises.
  #
  # The merge queue runs the quick tier here; this is the only place the rest
  # of the suite meets macOS.
  #
  # No netns and no raised limits on a hosted runner: the in-process suites run
  # gate-free (CHIMERA_LIMITS_TESTING passes vacuously off Linux) and the
  # genuinely networked suites serialize under the chimera_net lock.
  macos:
    name: Test macOS ${{ matrix.build_type }}
    runs-on: macos-14
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          # bison: Apple ships 2.3 and the ndrzcc grammar needs 3.x; the
          # top-level CMakeLists already adds the keg-only Homebrew path.
          # libxcrypt: Darwin libc crypt(3) is DES-only, and REST auth needs
          # full crypt(5) $-scheme verification.
          brew install cmake ninja bison jansson userspace-rcu rocksdb krb5 \
                       xxhash libxcrypt uthash openssl@3 libnghttp2
          # oras, not quint: this job has never had a model-based-test trace
          # corpus, so every MBT replay ctest disabled itself here.  A CI
          # checkout never has local edits to ext/specs, so the bundle the specs
          # CI published for the pinned commit always applies.
          brew install oras

          # Same pinned upstream ccache the Linux images get, from the same
          # mirror.  Upstream's darwin asset is one universal binary, so it
          # covers Intel and Apple Silicon alike.
          oras pull "ghcr.io/chimera-nas/ccache:4.14-darwin" --output "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/ccache-darwin" /usr/local/bin/ccache
          ccache --version | head -1

      # Restore only.  The macOS ccache is populated by build-test.yml's
      # push-to-main run, which saves on refs/heads/main -- the default-branch
      # scope every other run can read.
      - name: Restore the ccache directory
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v2-macos-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-macos-${{ matrix.build_type }}-

      # quint from the mirrored darwin payload rather than the npm registry and
      # the GitHub releases endpoint.  Only the Rust evaluator is platform
      # specific -- quint itself is JavaScript -- so this is the same tree the
      # Linux images get, plus the darwin evaluator, pre-placed where quint
      # looks for it.
      #
      # That pre-placement is a gate, not a nicety.  quint's default rust
      # backend fetches the evaluator on first use and ABORTS rather than
      # falling back to its interpreter when the fetch fails; a merge-queue run
      # has already died that way on an anonymous, rate-limited releases API
      # call, and the run after it found a half-written ~/.quint and died in
      # chmod.  Nothing is fetched at job time now.
      - name: Install quint from the mirrored payload
        run: |
          set -euo pipefail
          # Pinned by ext/specs/.quint-version, not hardcoded here: trace
          # generation is seeded and reproducible for a given quint release,
          # and that file is what records the release the corpus was generated
          # against.  The mirrored tag follows it.
          qver=$(tr -d '[:space:]' < ext/specs/.quint-version)
          oras pull "ghcr.io/chimera-nas/quint:${qver}-darwin" \
               --output "${RUNNER_TEMP}/quint-dl"
          mkdir -p "${RUNNER_TEMP}/quint"
          tar -xzf "${RUNNER_TEMP}/quint-dl/quint-darwin.tar.gz" \
              -C "${RUNNER_TEMP}/quint"
          ver=$(cat "${RUNNER_TEMP}/quint/evaluator-version")
          case "$(uname -m)" in
            arm64|aarch64) ev=quint_evaluator-aarch64 ;;
            x86_64)        ev=quint_evaluator-x86_64 ;;
            *) echo "no quint evaluator for $(uname -m)" >&2; exit 1 ;;
          esac
          dir="$HOME/.quint/rust-evaluator-$ver"
          mkdir -p "$dir"
          install -m 0755 "${RUNNER_TEMP}/quint/rust-evaluator-$ver/$ev" \
                  "$dir/quint_evaluator"
          echo "${RUNNER_TEMP}/quint/quint/bin" >> "$GITHUB_PATH"
          # --help, not --version: the evaluator rejects the latter and exits 1.
          "$dir/quint_evaluator" --help > /dev/null
          "${RUNNER_TEMP}/quint/quint/bin/quint" --version

      - name: Configure and build
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: 2G
        run: |
          # Counters ride along in the restored cache; zero them so the stats
          # below describe this run alone.
          ccache -z > /dev/null
          cmake -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DSPECS_BUNDLE=ON \
                -S "${{ github.workspace }}" -B "${{ runner.temp }}/build"
          ninja -C "${{ runner.temp }}/build"
          ccache --show-stats || true

      - name: Test
        run: |
          cd "${{ runner.temp }}/build"
          "${{ github.workspace }}/scripts/cap_ctest_output.sh" \
            ctest -C extended --output-on-failure --test-output-size-failed 65536 \
                  --timeout 300 -j "$(sysctl -n hw.ncpu)"

  # Informational measurement of the full smbtorture smb2 matrix (655 subtests x
  # 6 VFS backends).  The gating suite only registers the subtests in the
  # generated SMBTORTURE_ENABLED_<backend> allowlists, so 15-30% of the catalog
  # per backend never runs in CI at all; this job runs the complement too and
  # diffs the outcome against the checked-in baseline.
  #
  # It fails ONLY on a "newly failing" cell -- a subtest that is in the baseline
  # (and therefore gated) but did not pass.  A "still failing" cell is the
  # expected state of the exploration backlog and must not be noise, or the job
  # would be red every night and nobody would read it.
  #
  # amd64 Release only: the matrix is ~3900 daemon+netns+client invocations and
  # the baselines were measured on that configuration.
  # Writer for the macOS analysis ccache.  build-test.yml's analyze-macos runs
  # only in the merge queue, whose ref is discarded, so it can restore but never
  # usefully save; this job runs on a schedule against main and populates the
  # default-branch scope it reads from.
  analyze-macos:
    name: Analyze macOS ${{ matrix.build_type }}
    runs-on: macos-14
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        env:
          CCACHE_REF: ghcr.io/chimera-nas/ccache:4.14-darwin
        run: |
          brew update
          # No llvm: scan-build needed it for the analyzer *driver*, but driving
          # `clang --analyze` directly does not.  Dropping it also keeps this
          # job on Apple's clang -- the compiler ccc-analyzer was always
          # actually compiling with, since it invokes whatever `clang` resolves
          # to on PATH and only used brew's LLVM for the analysis pass.  Pinning
          # brew's clang for the whole build instead surfaced a warning Apple's
          # does not have (-Wunused-but-set-global) straight into -Werror.
          brew install cmake ninja bison jansson userspace-rcu rocksdb krb5 \
                       xxhash libxcrypt uthash openssl@3 libnghttp2 oras
          oras pull "${CCACHE_REF}" --output "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/ccache-darwin" /usr/local/bin/ccache
          ccache --version | head -1

      - name: Restore the ccache directory
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v2-macos-analyze-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-macos-analyze-${{ matrix.build_type }}-

      - name: Run the clang static analyzer
        id: static-analysis
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: 2G
          BUILD_DIR: ${{ runner.temp }}/build-analyze
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/scan-report"
          # Counters ride along in the restored cache; zero them so the stats
          # below describe this run alone.
          ccache -z > /dev/null
          cmake -G Ninja -D CMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                \
                -D CMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -S "$GITHUB_WORKSPACE" -B "$BUILD_DIR"
          ninja -C "$BUILD_DIR"
          python3 "$GITHUB_WORKSPACE/scripts/analyze_cached.py" \
                  --build-dir "$BUILD_DIR" \
                  --report-dir "$GITHUB_WORKSPACE/scan-report" \
                  --exclude "$GITHUB_WORKSPACE/ext/" \
                  -j "$(sysctl -n hw.ncpu)" \
            2>&1 | tee "$GITHUB_WORKSPACE/scan-report/analyzer-output.txt"
          ccache --show-stats || true

      - name: Upload static analysis report
        if: ${{ failure() && steps.static-analysis.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: analyzer-report-macos-${{ matrix.build_type }}
          path: scan-report/
          if-no-files-found: warn
          retention-days: 30

  smbtorture-matrix:
    name: smbtorture matrix (informational)
    needs: [build-devcontainer]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    # Passing cells cost ~0.6s, but a hung cell burns the full 300s timeout and
    # there are ~880 non-passing cells across the matrix; 3h leaves headroom.
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # A hosted runner has far less disk than the ARC hosts this used to run
      # on, and these images are large; see the action for what it reclaims.
      # The CI images are GHCR packages of this repository, so the pull below
      # is authenticated with the run's own token.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --privileged: the netns wrapper needs CAP_NET_ADMIN.  smbtorture itself
      # ships in the devcontainer image (samba-testsuite).
      # The matrix and both compare passes run in the container (which is where
      # python3 and smbtorture live); the runner steps only read the files it
      # leaves behind, so publishing never depends on tooling outside the image.
      #
      # compare runs twice over the same results: once to render the buckets for
      # the job summary, once to decide the exit status.  The verdict is recorded
      # as a flag file rather than failing here, so the summary and the artifacts
      # still publish when a gated test regressed -- exactly when they are worth
      # reading.  "still failing" is summarized but not listed; it is ~880 cells
      # of known backlog.
      # The scoping inputs reach regen.sh as environment variables passed through
      # by `docker run -e NAME` (value taken from the step env), never
      # interpolated into the container's command line -- a dispatch input is
      # attacker-controlled text and must not be able to break out of quoting.
      # Empty means the full matrix, which is what the scheduled run sends.
      #
      # compare measures against measured-catalog.txt -- the catalog the run
      # actually covered -- and not the checked-in SMBTORTURE_SUITES.  Identical
      # for a full run today; they diverge as soon as a dispatch scopes the
      # matrix or a Samba upgrade changes the catalog, and then the live one is
      # the honest denominator.  regen.sh writes that file on every run, scoped
      # or not, so nothing here has to infer the scope from which files exist.
      #
      # report.py runs last, after the verdict flag is settled: it renders the
      # same results into one self-contained HTML file, so the artifact carries
      # a path from a named cell down to the log that explains it rather than
      # ~880 loose smbt-fail.*.log files.  Last on purpose -- everything ahead
      # of it in the chain either publishes or decides the exit status, and a
      # rendering failure must not be able to skip the regression verdict.
      # It exits non-zero only when it genuinely could not read the results or
      # write the page (a regression is still a 0), so && is the same contract
      # the drift.md render above already runs under.
      #
      # safe.directory: the page stamps the revision of the baseline it judged
      # against, which is the whole defence against an old results set read
      # against newer allowlists.  /workspace is checked out by the runner and
      # the container is root, so without this git refuses the repo as dubious
      # ownership and the stamp silently degrades to "unknown revision" --
      # exactly the unlabelled report the stamp exists to prevent.
      - name: Build and run the matrix
        env:
          SMBTORTURE_BACKENDS: ${{ inputs.smbtorture_backends }}
          SMBTORTURE_FILTER: ${{ inputs.smbtorture_filter }}
          # Empty means "size it from the runner"; the dispatch input still
          # overrides.  See the run step below for why this is no longer 32.
          SMBTORTURE_PARALLEL: ${{ inputs.smbtorture_parallel }}
        run: |
          rm -rf smbt-report
          mkdir -p smbt-report
          # 32 was sized for the ARC hosts.  A cell is a chimera server plus an
          # smbtorture client, and for the diskfs backends the server also lays
          # down ten 1 GB device images; thirty-two of those at once on a
          # four-vCPU, 16 GB hosted runner ran the machine out of memory.  The
          # servers then died during startup --
          #
          #   io_uring_queue_init_params() failed: Cannot allocate memory (-12)
          #
          # -- before their test ran, and smbtorture recorded the cell as
          # failed.  That is what turned this job red the first time it ran on
          # hosted runners: 53 "newly failing" cells, 45 of them on
          # diskfs_io_uring (io_uring rings AND the device images), and none at
          # all on memfs, linux or plain io_uring.  The same run took 36 minutes
          # against 16 before the move, at identical concurrency -- the machine
          # was thrashing, not the tests regressing.
          #
          # Two per vCPU keeps the overlap these cells actually benefit from --
          # they spend most of their time waiting on a daemon, which is why
          # oversubscribing at all is right -- without the 8x that broke them.
          # regen.sh's own default is 12, for reference.  Derived rather than
          # hardcoded so a runner change does not silently reintroduce this.
          if [ -z "${SMBTORTURE_PARALLEL}" ]; then
            SMBTORTURE_PARALLEL=$(( $(nproc) * 2 ))
          fi
          export SMBTORTURE_PARALLEL
          echo "smbtorture concurrency: ${SMBTORTURE_PARALLEL} cells ($(nproc) vCPU)"
          docker run --rm --privileged \
            -e SMBTORTURE_BACKENDS \
            # Ring depth for the io_uring event core.  The default 8192
            # entries cost ~1.5 MB of kernel-accounted memory per ring
            # (SQE128/CQE32 double both entry sizes) and SQPOLL adds a kernel
            # thread each; ctest -j nproc runs many multi-threaded chimera
            # processes at once, which is enough to be refused with ENOMEM and
            # lose unrelated tests to a fatal ring allocation.  Ask for a ring
            # sized to a test rather than to a server.
            -e EVPL_IO_URING_ENTRIES=1024 \
            -e SMBTORTURE_FILTER \
            -e SMBTORTURE_PARALLEL \
            -v "${{ github.workspace }}:/workspace" \
            -v /build \
            -w /build \
            ${{ env.DEV_IMAGE_TAG_PREFIX }}:${{ github.sha }}-amd64 \
            bash -euxc '\
              cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DREQUIRE_NETNS_TESTS=ON /workspace && \
              ninja smbtorture_test && \
              /workspace/tools/smbtorture/regen.sh --report-only \
                  --build-dir /build \
                  --out-dir /workspace/smbt-report && \
              cd /workspace && \
              python3 tools/smbtorture/regen.py compare \
                  --results smbt-report/results.txt \
                  --cmake src/server/smb/tests/CMakeLists.txt \
                  --subs smbt-report/measured-catalog.txt \
                  --format markdown \
                  --quiet-buckets "still failing" \
                > smbt-report/drift.md && \
              { python3 tools/smbtorture/regen.py compare \
                  --results smbt-report/results.txt \
                  --cmake src/server/smb/tests/CMakeLists.txt \
                  --subs smbt-report/measured-catalog.txt \
                  --quiet-buckets "still failing,skipped" \
                  --fail-on-newly-failing > /dev/null \
                || touch smbt-report/newly-failing.flag; } && \
              git config --global --add safe.directory /workspace && \
              python3 tools/smbtorture/report.py \
                  --results smbt-report/results.txt \
                  --cmake src/server/smb/tests/CMakeLists.txt \
                  --output smbt-report/report.html'

      - name: Report baseline drift
        if: always()
        run: |
          if [ -f smbt-report/drift.md ]; then
            {
              echo '## smbtorture baseline drift'
              cat smbt-report/drift.md
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## smbtorture baseline drift' >> "$GITHUB_STEP_SUMMARY"
            echo 'The matrix did not complete; no results to compare.' >> "$GITHUB_STEP_SUMMARY"
          fi
          # The buckets above name the cells but cannot show why any of them
          # failed.  A step summary cannot link to a file inside an artifact,
          # so name the artifact and let the reader download it.
          if [ -f smbt-report/report.html ]; then
            {
              echo
              echo 'Browsable per-cell report: `report.html` in the `smbtorture-matrix-amd64` artifact.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload matrix results and failure logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smbtorture-matrix-amd64
          path: smbt-report/
          if-no-files-found: warn
          retention-days: 30

      # Only a regression in a gated subtest turns the job red.  A missing flag
      # file means either no regression or a matrix that never finished, and the
      # latter already failed its own step.
      - name: Fail on a regression in a gated subtest
        if: always()
        run: |
          if [ -f smbt-report/newly-failing.flag ]; then
            echo "a gated smbtorture subtest regressed; see the job summary" >&2
            exit 1
          fi

  static-analysis:
    name: Analyze ${{ matrix.image_name }} ${{ matrix.arch }} ${{ matrix.build_type }}
    needs: [build-devcontainer, build-ubuntu26, build-ubuntu24, build-ubuntu22, build-rocky9, build-rocky10]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # devcontainer
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            build_type: Release
