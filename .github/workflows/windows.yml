name: Windows
on:
  workflow_call:
    inputs:
      test_tier:
        type: string
        default: quick
      full_matrix:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      test_tier:
        description: Test tier
        type: choice
        options: [quick, extended]
        default: quick
      full_matrix:
        description: Run x64/ARM64 Debug/Release (false selects x64 Release)
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  test:
    name: Test Windows ${{ matrix.arch }} ${{ matrix.config }} (${{ inputs.test_tier }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    env:
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_USE_NUGET_CACHE: 'false'
      X_VCPKG_NUGET_ID_PREFIX: chimera-
      VS_VERSION_RANGE: ${{ matrix.vs }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.full_matrix && '[{"runner":"windows-2022","arch":"x64","config":"Debug","vs":"[17.0,18.0)"},{"runner":"windows-2022","arch":"x64","config":"Release","vs":"[17.0,18.0)"},{"runner":"windows-11-vs2026-arm","arch":"ARM64","config":"Debug","vs":"[18.0,19.0)"},{"runner":"windows-11-vs2026-arm","arch":"ARM64","config":"Release","vs":"[18.0,19.0)"}]' || '[{"runner":"windows-2022","arch":"x64","config":"Release","vs":"[17.0,18.0)"}]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # The ARM64 image keeps the workspace on C:, a network-attached OS disk
      # where each FlushFileBuffers costs 3-5 ms, against 0.25 ms on the x64
      # image's local D:.  diskfs and cairn flush on nearly every operation,
      # which made their tests 5-25x slower on ARM64 than on x64.  That image
      # also carries an unformatted local NVMe disk, as fast as x64's D:.
      # Format it and move every test scratch location onto it: the rooted
      # /tmp and /build/test the tests use resolve against the current drive,
      # the build tree holds per-test session directories, and TEMP covers the
      # rest.  The same directories are reachable as <drive>:\tmp and
      # <drive>:\build on either volume, so a test resolves them to the same
      # place whichever drive its working directory is on.  A runner with no
      # raw disk -- the x64 image -- skips this.
      - name: Put test scratch space on the local NVMe disk
        shell: pwsh
        run: |
          $raw = Get-Disk | Where-Object PartitionStyle -eq 'RAW' | Sort-Object Size -Descending | Select-Object -First 1
          if (-not $raw) { 'No raw local disk; scratch stays on the workspace drive.'; exit 0 }
          $volume = Initialize-Disk -Number $raw.Number -PartitionStyle GPT -PassThru |
            New-Partition -UseMaximumSize -AssignDriveLetter |
            Format-Volume -FileSystem NTFS -NewFileSystemLabel scratch -Confirm:$false -Force
          $scratch = "$($volume.DriveLetter):"
          $workspace = (Get-Location).Drive.Name + ':'
          New-Item -ItemType Directory -Force "$scratch/tmp", "$scratch/build", "$scratch/workspace-build", "$scratch/temp" | Out-Null
          New-Item -ItemType Junction -Path "$workspace/tmp" -Target "$scratch/tmp" | Out-Null
          New-Item -ItemType Junction -Path "$workspace/build" -Target "$scratch/build" | Out-Null
          New-Item -ItemType Junction -Path "$pwd/build" -Target "$scratch/workspace-build" | Out-Null
          "TEMP=$scratch\temp" >> $env:GITHUB_ENV
          "TMP=$scratch\temp" >> $env:GITHUB_ENV
          "Test scratch space is on $scratch ($($raw.FriendlyName))"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install model generator and prepare scratch directories
        shell: pwsh
        run: |
          $version = (Get-Content ext/specs/.quint-version).Trim()
          npm install -g "@informalsystems/quint@$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force /tmp, /build/test | Out-Null
      - name: Read pinned vcpkg revision
        id: manifest
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          if ($baseline -notmatch '^[0-9a-f]{40}$') { throw 'Expected a pinned vcpkg baseline' }
          "baseline=$baseline" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.manifest.outputs.baseline }}
          path: _vcpkg
          persist-credentials: false
      - name: Select the publisher's toolchain and bootstrap vcpkg
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -version $env:VS_VERSION_RANGE -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw "Visual Studio $env:VS_VERSION_RANGE is required" }
          "VCPKG_VISUAL_STUDIO_PATH=$vs" >> $env:GITHUB_ENV
          & ./_vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Ninja drives cl.exe directly rather than through MSBuild, so the job
      # needs what a Developer Command Prompt provides: the environment of the
      # same Visual Studio the prebuilt dependencies were published with,
      # targeting this runner's native architecture.
      - name: Enter the MSVC developer environment
        shell: pwsh
        run: |
          $arch = '${{ matrix.arch }}'.ToLower()
          $vcvars = Join-Path $env:VCPKG_VISUAL_STUDIO_PATH 'VC/Auxiliary/Build/vcvarsall.bat'
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $after = cmd.exe /c "call `"$vcvars`" $arch >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvarsall $arch failed" }
          foreach ($line in $after) {
            if ($line -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV
            }
          }
      # Ninja schedules every compile and every model-corpus family as one
      # graph, so the corpus generates alongside the C build instead of ahead
      # of it, as on the other platforms.  ccache is the compiler cache the
      # Linux and macOS jobs use; the Visual Studio generators ignore a
      # compiler launcher, which is why this job no longer uses one.  Both are
      # pinned upstream releases, checked like WinFlexBison below.
      - name: Install ninja and ccache
        shell: pwsh
        run: |
          $tools = "$env:RUNNER_TEMP/tools"
          New-Item -ItemType Directory -Force $tools | Out-Null
          if ('${{ matrix.arch }}' -eq 'ARM64') {
            $downloads = @(
              @('https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-winarm64.zip', 'e52f0bdef9dfb1003229dbd6508a508c4073fd017247002adc66e5e806cb0391'),
              @('https://github.com/ccache/ccache/releases/download/v4.14/ccache-4.14-windows-aarch64.zip', 'baa07085f68f75ea033d6f8d8fe6b53b7f353050bd191e299ff27e131cc3d787'))
          } else {
            $downloads = @(
              @('https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-win.zip', '07fc8261b42b20e71d1720b39068c2e14ffcee6396b76fb7a795fb460b78dc65'),
              @('https://github.com/ccache/ccache/releases/download/v4.14/ccache-4.14-windows-x86_64.zip', '2568347a697e103ca1b073981c704ad76fb2507d066c38dba038dd73399d968f'))
          }
          foreach ($download in $downloads) {
            $archive = Join-Path $env:RUNNER_TEMP (Split-Path $download[0] -Leaf)
            Invoke-WebRequest $download[0] -OutFile $archive -MaximumRetryCount 5 -RetryIntervalSec 10
            if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $download[1]) { throw "$archive checksum mismatch" }
            Expand-Archive $archive $tools -Force
          }
          Move-Item "$tools/ccache-4.14-windows-*/ccache.exe" $tools
          $tools >> $env:GITHUB_PATH
          "CCACHE_DIR=$env:RUNNER_TEMP\ccache" >> $env:GITHUB_ENV
          "CCACHE_MAXSIZE=2G" >> $env:GITHUB_ENV
          "SPECS_CORPUS_CACHE_DIR=$env:RUNNER_TEMP\specs-corpus-cache" >> $env:GITHUB_ENV
          & "$tools/ninja.exe" --version
          & "$tools/ccache.exe" --version | Select-Object -First 1
      - name: Configure read-only package access
        shell: pwsh
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $nuget = & ./_vcpkg/vcpkg.exe fetch nuget | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $config = "$env:RUNNER_TEMP/chimera-vcpkg-nuget.config"
          $feed = "https://nuget.pkg.github.com/$($env:GITHUB_REPOSITORY_OWNER.ToLowerInvariant())/index.json"
          '<configuration><packageSources><clear /></packageSources></configuration>' | Set-Content $config
          & $nuget sources Add -Name Chimera -Source $feed -UserName $env:GITHUB_ACTOR -Password $env:GH_PACKAGES_TOKEN -StorePasswordInClearText -ConfigFile $config -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_BINARY_SOURCES=clear;nugetconfig,$config,read;nugettimeout,120" >> $env:GITHUB_ENV
      - name: Restore prebuilt dependencies
        shell: pwsh
        run: |
          $triplet = '${{ matrix.arch }}'.ToLower() + '-windows'
          New-Item -ItemType Directory -Force dependency-report | Out-Null
          $compiler = (Get-Command cl.exe).Source
          $metadata = [ordered]@{
            runner_image = $env:ImageVersion
            runner_os = $env:ImageOS
            triplet = $triplet
            compiler = $compiler
            compiler_sha256 = (Get-FileHash $compiler -Algorithm SHA256).Hash.ToLowerInvariant()
            cmake = (cmake --version | Select-Object -First 1)
            powershell = $PSVersionTable.PSVersion.ToString()
            vcpkg = (& ./_vcpkg/vcpkg.exe version | Select-Object -First 1)
          }
          $metadata | ConvertTo-Json | Set-Content dependency-report/runner.json
          $metadata | ConvertTo-Json
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          & ./_vcpkg/vcpkg.exe install --triplet $triplet --host-triplet $triplet "--x-install-root=$pwd/build/vcpkg_installed" --only-binarycaching --x-abi-tools-use-exact-versions *>&1 |
            Tee-Object -FilePath dependency-report/restore.log
          $restoreExit = $LASTEXITCODE
          if ($restoreExit -ne 0) {
            $restoreLog = Get-Content dependency-report/restore.log -Raw
            $cacheMiss = $restoreLog -match '(?i)(NotFound|404\s+\(Not Found\))'
            $transient = $restoreLog -match '(?i)(timed?\s*out|429|too many requests|50[0234]|connection (?:reset|closed|refused)|temporarily unavailable|network is unreachable|name resolution|could not resolve|request was aborted|error occurred while sending|SSL connection)'
            if (-not $cacheMiss -and $transient) {
              Write-Warning 'Transient package transport failure; retrying once after 15 seconds.'
              Start-Sleep -Seconds 15
              & ./_vcpkg/vcpkg.exe install --triplet $triplet --host-triplet $triplet "--x-install-root=$pwd/build/vcpkg_installed" --only-binarycaching --x-abi-tools-use-exact-versions *>&1 |
                Tee-Object -FilePath dependency-report/restore-retry.log
              $restoreExit = $LASTEXITCODE
              if ($restoreExit -ne 0) {
                $retryLog = Get-Content dependency-report/restore-retry.log -Raw
                $cacheMiss = $retryLog -match '(?i)(NotFound|404\s+\(Not Found\))'
              }
            }
          }
          if ($restoreExit -ne 0) {
            @(
              '### Windows dependency restore failed'
              ''
              "Runner image: $env:ImageVersion"
              "Triplet: $triplet"
              "Compiler SHA256: $($metadata.compiler_sha256)"
              ''
              $(if ($cacheMiss) { 'The feed does not contain packages for this ABI. Run Publish Windows dependencies on main.' } else { 'Package transport failed; see the diagnostic artifact.' })
            ) >> $env:GITHUB_STEP_SUMMARY
            Write-Error 'Binary dependency restore failed. See the job summary and diagnostic artifact.'
            exit 1
          }
          $timer.Stop()
          "Prebuilt dependency restore ($triplet): $([math]::Round($timer.Elapsed.TotalSeconds, 1)) seconds; no dependency source builds permitted." >> $env:GITHUB_STEP_SUMMARY
      - name: Upload dependency restore diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-dependency-restore-${{ matrix.arch }}-${{ matrix.config }}
          retention-days: 14
          path: |
            dependency-report/
            _vcpkg/buildtrees/**/*.log
            _vcpkg/buildtrees/**/vcpkg_abi_info.txt
      - name: Verify Windows dependencies do not include OpenSSL
        shell: pwsh
        run: |
          $status = Get-Content build/vcpkg_installed/vcpkg/status -Raw
          if ($status -match '(?m)^Package: openssl\r?$') { throw 'Windows must use native TLS and crypto' }
      - name: Install parser generators
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP/winflexbison.zip"
          Invoke-WebRequest https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip -OutFile $archive -MaximumRetryCount 5 -RetryIntervalSec 10
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '8d324b62be33604b2c45ad1dd34ab93d722534448f55a16ca7292de32b6ac135') { throw 'WinFlexBison checksum mismatch' }
          Expand-Archive $archive "$env:RUNNER_TEMP/winflexbison"
      # The same shared caches as the Linux and macOS jobs, one lane per arch
      # and configuration: restored from the newest entry, saved only by
      # build-test.yml's push to main.  See the notes at the top of that file.
      - name: Restore the ccache directory
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v2-windows-${{ matrix.arch }}-${{ matrix.config }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-windows-${{ matrix.arch }}-${{ matrix.config }}-
      - name: Restore the model corpus cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/specs-corpus-cache
          key: specs-corpus-v1-windows-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            specs-corpus-v1-windows-${{ matrix.arch }}-
      - name: Configure native Windows
        id: configure
        shell: pwsh
        run: |
          $triplet = '${{ matrix.arch }}'.ToLower() + '-windows'
          # Debug information in every configuration, so a daemon that hangs
          # or crashes in a Release cell -- or in the smb-client job, which
          # runs the Release build -- can be symbolized.  /Z7 keeps it
          # cacheable; /DEBUG turns the linker's /OPT:REF and /OPT:ICF off by
          # default, so they are restored to keep Release code unchanged.
          $releaseLink = '/DEBUG /INCREMENTAL:NO /OPT:REF /OPT:ICF'
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_C_COMPILER=cl "-DCMAKE_TOOLCHAIN_FILE=$pwd/_vcpkg/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_TARGET_TRIPLET=$triplet" "-DVCPKG_HOST_TRIPLET=$triplet" "-DFLEX_EXECUTABLE=$env:RUNNER_TEMP/winflexbison/win_flex.exe" "-DBISON_EXECUTABLE=$env:RUNNER_TEMP/winflexbison/win_bison.exe" "-DVCPKG_INSTALL_OPTIONS=--only-binarycaching;--x-abi-tools-use-exact-versions" -DOTEL_SQLITE=ON -DREQUIRE_CTL_MBT=ON -DREQUIRE_DISKFS_MBT=ON -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded "-DCMAKE_EXE_LINKER_FLAGS_RELEASE=$releaseLink" "-DCMAKE_SHARED_LINKER_FLAGS_RELEASE=$releaseLink"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The installed libraries live in build/vcpkg_installed. Drop temporary
      # package extraction/probe trees before diskfs tests need scratch space.
      - name: Release dependency staging space
        shell: pwsh
        run: |
          foreach ($path in @('_vcpkg/packages', '_vcpkg/buildtrees')) {
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          }
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free
      - name: Build
        shell: pwsh
        run: |
          # Counters ride along in the restored cache; zero them so the stats
          # below describe this run alone.
          ccache -z | Out-Null
          $runStart = Get-Date
          cmake --build build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ccache --show-stats
          # Trim to the configured ceiling before the save, so the entry the
          # other workflows restore stays a predictable size.
          ccache --trim-max-size $env:CCACHE_MAXSIZE
          # Keep only the corpus cells this build used.
          $entries = Join-Path $env:SPECS_CORPUS_CACHE_DIR 'v1'
          if (Test-Path $entries) {
            Get-ChildItem $entries -Directory | Where-Object LastWriteTime -lt $runStart | Remove-Item -Recurse -Force
          }
          exit 0
      # The daemon and its DLLs, for the smb-client job below: it runs the
      # real Windows SMB client against this build on runners that cannot
      # build it themselves.
      - name: Bundle the daemon for the SMB client test
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          $bundle = "$env:RUNNER_TEMP/smb-client-bundle"
          New-Item -ItemType Directory -Force $bundle | Out-Null
          Copy-Item build/bin/chimera.exe, build/bin/chimera.pdb, build/bin/*.dll $bundle
          Copy-Item src/server/smb/tests/windows_client/windows_smb_client_test.py $bundle
      - name: Upload the SMB client test bundle
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v6
        with:
          name: windows-smb-client-bundle-${{ matrix.arch }}
          path: ${{ runner.temp }}/smb-client-bundle
          retention-days: 1
      - name: Test
        shell: pwsh
        env:
          TEST_TIER: ${{ inputs.test_tier }}
        run: |
          New-Item -ItemType Directory -Force ctest-results | Out-Null
          # A single-config build selects the tier with -C, as on Unix.
          $selection = @()
          if ($env:TEST_TIER -eq 'extended') {
            $selection = @('-C', 'extended')
          } elseif ($env:TEST_TIER -ne 'quick') {
            throw "Unknown test tier: $env:TEST_TIER"
          }
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          ctest --test-dir build @selection --output-on-failure --no-tests=error --parallel 4 --timeout 300 --test-output-size-failed 65536 --output-junit "$pwd/ctest-results/results.xml"
          $testExit = $LASTEXITCODE
          $timer.Stop()
          [math]::Round($timer.Elapsed.TotalSeconds) | Set-Content ctest-results/duration_seconds
          exit $testExit
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ctest-junit-windows-${{ matrix.arch }}-${{ matrix.config }}
          path: ctest-results/
          if-no-files-found: warn
          retention-days: 30
      # Saved even when the job failed, as on the other platforms: the caches
      # reflect a build that happened.
      - name: Save the ccache directory
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v2-windows-${{ matrix.arch }}-${{ matrix.config }}-${{ github.sha }}
      - name: Save the model corpus cache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/specs-corpus-cache
          key: specs-corpus-v1-windows-${{ matrix.arch }}-${{ github.sha }}
      - name: Remove temporary package credentials
        if: always()
        shell: pwsh
        run: |
          Remove-Item "$env:RUNNER_TEMP/chimera-vcpkg-nuget.config" -Force -ErrorAction SilentlyContinue

  # The real Windows SMB client against a native chimera daemon on the same
  # machine, one daemon per backend.  Port 445 belongs to the kernel's own SMB
  # server, so the drive is mapped with `net use /TCPPORT`, which the client
  # has from Windows 11 24H2 and Windows Server 2025; Server 2022, the image
  # the x64 build cells use, has no such option.  So this job takes the
  # Release daemon those cells built and runs it on Server 2025 (x64) and
  # Windows 11 (ARM64).  See
  # src/server/smb/tests/windows_client/windows_smb_client_test.py.
  smb-client:
    name: SMB client ${{ matrix.os }} ${{ matrix.arch }}
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.full_matrix && '[{"runner":"windows-2025","os":"Server 2025","label":"server2025","arch":"x64"},{"runner":"windows-11-vs2026-arm","os":"Windows 11","label":"windows11","arch":"ARM64"}]' || '[{"runner":"windows-2025","os":"Server 2025","label":"server2025","arch":"x64"}]') }}
    steps:
      # As in the test job: the ARM64 image's C: is slow to flush, and diskfs
      # and cairn flush on nearly every operation.
      - name: Put scratch space on the local NVMe disk
        shell: pwsh
        run: |
          $raw = Get-Disk | Where-Object PartitionStyle -eq 'RAW' | Sort-Object Size -Descending | Select-Object -First 1
          if (-not $raw) { 'No raw local disk; scratch stays on the default drive.'; exit 0 }
          $volume = Initialize-Disk -Number $raw.Number -PartitionStyle GPT -PassThru |
            New-Partition -UseMaximumSize -AssignDriveLetter |
            Format-Volume -FileSystem NTFS -NewFileSystemLabel scratch -Confirm:$false -Force
          $temp = "$($volume.DriveLetter):\temp"
          New-Item -ItemType Directory -Force $temp | Out-Null
          "TEMP=$temp" >> $env:GITHUB_ENV
          "TMP=$temp" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@v6
        with:
          name: windows-smb-client-bundle-${{ matrix.arch }}
          path: bundle
      - name: Run the Windows SMB client against memfs, diskfs and cairn
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ctest-results | Out-Null
          python bundle/windows_smb_client_test.py bundle/chimera.exe memfs diskfs cairn --junit ctest-results/results.xml --duration ctest-results/duration_seconds
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ctest-junit-windows-smbclient-${{ matrix.label }}-${{ matrix.arch }}
          path: ctest-results/
          if-no-files-found: warn
          retention-days: 30
