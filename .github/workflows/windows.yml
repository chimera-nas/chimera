name: Native Windows
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-runtime:
    name: Runtime ${{ matrix.arch }} ${{ matrix.config }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2022, arch: x64, config: Debug, generator: "Visual Studio 17 2022", vs: "[17.0,18.0)"}
          - {runner: windows-2022, arch: x64, config: Release, generator: "Visual Studio 17 2022", vs: "[17.0,18.0)"}
          - {runner: windows-11-vs2026-arm, arch: ARM64, config: Debug, generator: "Visual Studio 18 2026", vs: "[18.0,19.0)"}
          - {runner: windows-11-vs2026-arm, arch: ARM64, config: Release, generator: "Visual Studio 18 2026", vs: "[18.0,19.0)"}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Test native runtime
        shell: pwsh
        run: |
          cmake -S src/common/tests/native -B runtime -G "${{ matrix.generator }}" -A ${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build runtime --config ${{ matrix.config }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir runtime -C ${{ matrix.config }} --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  native:
    name: MSVC ${{ matrix.arch }} ${{ matrix.config }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    env:
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_USE_NUGET_CACHE: 'false'
      X_VCPKG_NUGET_ID_PREFIX: chimera-
      VS_VERSION_RANGE: ${{ matrix.vs }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2022, arch: x64, config: Debug, generator: "Visual Studio 17 2022", vs: "[17.0,18.0)"}
          - {runner: windows-2022, arch: x64, config: Release, generator: "Visual Studio 17 2022", vs: "[17.0,18.0)"}
          - {runner: windows-11-vs2026-arm, arch: ARM64, config: Debug, generator: "Visual Studio 18 2026", vs: "[18.0,19.0)"}
          - {runner: windows-11-vs2026-arm, arch: ARM64, config: Release, generator: "Visual Studio 18 2026", vs: "[18.0,19.0)"}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install model generator and prepare scratch directories
        shell: pwsh
        run: |
          $version = (Get-Content ext/specs/.quint-version).Trim()
          npm install -g "@informalsystems/quint@$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force /tmp, /build/test | Out-Null
      - name: Read pinned vcpkg revision
        id: manifest
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          if ($baseline -notmatch '^[0-9a-f]{40}$') { throw 'Expected a pinned vcpkg baseline' }
          "baseline=$baseline" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.manifest.outputs.baseline }}
          path: _vcpkg
          persist-credentials: false
      - name: Select the publisher's toolchain and bootstrap vcpkg
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -version $env:VS_VERSION_RANGE -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw "Visual Studio $env:VS_VERSION_RANGE is required" }
          "VCPKG_VISUAL_STUDIO_PATH=$vs" >> $env:GITHUB_ENV
          & ./_vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure read-only package access
        shell: pwsh
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $nuget = & ./_vcpkg/vcpkg.exe fetch nuget | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $config = "$env:RUNNER_TEMP/chimera-vcpkg-nuget.config"
          $feed = "https://nuget.pkg.github.com/$($env:GITHUB_REPOSITORY_OWNER.ToLowerInvariant())/index.json"
          '<configuration><packageSources><clear /></packageSources></configuration>' | Set-Content $config
          & $nuget sources Add -Name Chimera -Source $feed -UserName $env:GITHUB_ACTOR -Password $env:GH_PACKAGES_TOKEN -StorePasswordInClearText -ConfigFile $config -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_BINARY_SOURCES=clear;nugetconfig,$config,read" >> $env:GITHUB_ENV
      - name: Restore prebuilt dependencies
        shell: pwsh
        run: |
          $triplet = '${{ matrix.arch }}'.ToLower() + '-windows'
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          & ./_vcpkg/vcpkg.exe install --triplet $triplet --host-triplet $triplet "--x-install-root=$pwd/build/vcpkg_installed" --only-binarycaching
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'Binary dependency restore failed. Check package access and run Publish Windows dependencies on main for this manifest/toolchain.'
            exit 1
          }
          $timer.Stop()
          "Prebuilt dependency restore ($triplet): $([math]::Round($timer.Elapsed.TotalSeconds, 1)) seconds; no dependency source builds permitted." >> $env:GITHUB_STEP_SUMMARY
      - name: Verify Windows dependencies do not include OpenSSL
        shell: pwsh
        run: |
          $status = Get-Content build/vcpkg_installed/vcpkg/status -Raw
          if ($status -match '(?m)^Package: openssl\r?$') { throw 'Windows must use native TLS and crypto' }
      - name: Install parser generators
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP/winflexbison.zip"
          Invoke-WebRequest https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip -OutFile $archive -MaximumRetryCount 5 -RetryIntervalSec 10
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '8d324b62be33604b2c45ad1dd34ab93d722534448f55a16ca7292de32b6ac135') { throw 'WinFlexBison checksum mismatch' }
          Expand-Archive $archive "$env:RUNNER_TEMP/winflexbison"
      # Model traces depend on the generator, models and cell configuration,
      # not on the C implementation being tested. Only an exact input match
      # can reuse them; configure still validates every registered cell.
      - uses: actions/cache/restore@v4
        id: corpus-cache
        with:
          path: build/specs-corpus
          key: windows-specs-v1-${{ matrix.arch }}-${{ hashFiles('ext/specs/.quint-version', 'ext/specs/CMakeLists.txt', 'ext/specs/cmake/**', 'ext/specs/quint/**', 'ext/specs/tools/**', 'src/**/quint/configs/**', 'src/**/CMakeLists.txt', 'CMakeLists.txt', 'cmake/**', 'vcpkg.json', '.github/workflows/windows.yml') }}
      - name: Configure native Windows
        id: configure
        shell: pwsh
        run: |
          $triplet = '${{ matrix.arch }}'.ToLower() + '-windows'
          $prebuiltCorpus = if ('${{ steps.corpus-cache.outputs.cache-hit }}' -eq 'true') { 'ON' } else { 'OFF' }
          cmake -S . -B build -G "${{ matrix.generator }}" -A ${{ matrix.arch }} "-DCMAKE_TOOLCHAIN_FILE=$pwd/_vcpkg/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_TARGET_TRIPLET=$triplet" "-DVCPKG_HOST_TRIPLET=$triplet" "-DFLEX_EXECUTABLE=$env:RUNNER_TEMP/winflexbison/win_flex.exe" "-DBISON_EXECUTABLE=$env:RUNNER_TEMP/winflexbison/win_bison.exe" "-DSPECS_CORPUS_PREBUILT=$prebuiltCorpus" "-DVCPKG_INSTALL_OPTIONS=--only-binarycaching" -DOTEL_SQLITE=ON -DREQUIRE_CTL_MBT=ON -DREQUIRE_DISKFS_MBT=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The installed libraries live in build/vcpkg_installed. Drop temporary
      # package extraction/probe trees before diskfs tests need scratch space.
      - name: Release dependency staging space
        shell: pwsh
        run: |
          foreach ($path in @('_vcpkg/packages', '_vcpkg/buildtrees')) {
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          }
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free
      # A TLS regression should fail before model generation or the long
      # application suite. These tests also run again in the full suite.
      - name: Build TLS and HTTPS smoke tests
        run: cmake --build build --config ${{ matrix.config }} --parallel 4 --target hello_world_stream hello_world_connected_msg ping_pong_stream ping_pong_connected_msg bulk_connected_msg bulk_stream rand_full_duplex_stream http_h2_client_tls http_h2_tls
      - name: Test TLS and HTTPS smoke paths
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --no-tests=error --timeout 90 --output-junit tls-results.xml -R 'libevpl/(tls/|http/h2.*tls)'
      - name: Build server
        run: cmake --build build --target chimera --config ${{ matrix.config }} --parallel 4
      # Fail common runtime paths before spending time generating the full
      # model corpus. The full suite below remains the final gate.
      - name: Build application smoke tests
        run: cmake --build build --config ${{ matrix.config }} --parallel 4 --target vfs_kv_test vfs_notify_test vfs_claim_test vfs_umount_wait_test diskfs_smoke_test vfs_clone_range_test vfs_zerorange_test client_read_into s3_mbt_probe nfs_pnfs_probe nfs_aux_probe posix_test_mknod posix_test_faccessat space_map_budget_test smb2_rename_disconnect_probe smb_loopback_probe
      - name: Test application smoke paths
        id: smoke
        continue-on-error: true
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --no-tests=error --parallel 4 --timeout 60 --output-junit smoke-results.xml -R 'chimera/(daemon/(config_test|native_lifecycle)|server/mount_create|vfs/(kv_test|notify_test|claim_test|umount_wait_test|diskfs/(smoke_test|space_budget_test)|clone_range_test|zerorange_memfs)|server/nfs/mbt/pnfs_startup|server/nfs/mbtaux/probe_memfs|server/smb/mbt/rename_disconnect_probe_memfs|server/s3/mbt/probe_memfs|posix/(mknod_nfs3_memfs|faccessat_memfs|smb/loopback_.*refused.*)|client/read_into)$'
      # Exercise the intermittent auxiliary NFS failure before the long suite.
      - name: Repeat auxiliary NFS probe
        if: steps.smoke.outcome == 'success'
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --no-tests=error --repeat until-fail:20 --output-junit nfs-repeat-results.xml -R '^chimera/server/nfs/mbtaux/probe_memfs$'
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-smoke-${{ matrix.arch }}-${{ matrix.config }}
          path: |
            build/smoke-results.xml
            build/nfs-repeat-results.xml
            build/Testing/Temporary/
            build/**/*.debug.log
            build/**/*.map
          if-no-files-found: ignore
      - name: Require application smoke tests
        if: steps.smoke.outcome == 'failure'
        run: exit 1
      # Publish the complete corpus before compiling the remaining tests, so
      # an unrelated compiler error does not discard expensive model work.
      - name: Generate protocol model corpus
        run: cmake --build build --target specs_corpus --config ${{ matrix.config }} --parallel 4
      - uses: actions/cache/save@v4
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        with:
          path: build/specs-corpus
          key: ${{ steps.corpus-cache.outputs.cache-primary-key }}
      - name: Build tests and SDK example
        run: cmake --build build --config ${{ matrix.config }} --parallel 4
      - name: Test native backends
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --no-tests=error --parallel 4 --timeout 300 --output-junit results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.arch }}-${{ matrix.config }}
          path: |
            build/results.xml
            build/tls-results.xml
            build/Testing/Temporary/
            build/**/*.debug.log
            build/**/*.metrics.prom
            build/**/*.map
          if-no-files-found: ignore
      - name: Remove temporary package credentials
        if: always()
        shell: pwsh
        run: |
          Remove-Item "$env:RUNNER_TEMP/chimera-vcpkg-nuget.config" -Force -ErrorAction SilentlyContinue
