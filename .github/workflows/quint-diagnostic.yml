name: Temporary Linux Quint diagnostic
on:
  push:
    branches: [windows-linux-quint-diagnostic]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          load: true
          tags: chimera-quint-diagnostic:local
          cache-from: type=registry,ref=ghcr.io/chimera-nas/chimera-dev:buildcache-amd64
          build-args: UBUNTU_MIRROR=azure
      - name: Reproduce with failure logs retained
        run: |
          mkdir -p quint-diagnostics
          docker run --rm --privileged -v "$PWD:/workspace" -v /build -w /build \
            chimera-quint-diagnostic:local bash -euxc '
              preserve() {
                df -h > /workspace/quint-diagnostics/disk-after.txt
                cp /build/Testing/Temporary/LastTest.log /workspace/quint-diagnostics/ 2>/dev/null || true
                cp /build/Testing/Temporary/LastTestsFailed.log /workspace/quint-diagnostics/ 2>/dev/null || true
                python3 /workspace/scripts/preserve_quint_diagnostics.py
              }
              trap preserve EXIT
              df -h > /workspace/quint-diagnostics/disk-before.txt
              cmake -G Ninja -DCMAKE_BUILD_TYPE=Coverage -DCMAKE_C_COMPILER=clang \
                -DKVM_TESTING=OFF -DREQUIRE_CTL_MBT=ON /workspace
              ninja -j4
              mkdir -p coverage/profraw
              export LLVM_PROFILE_FILE=/build/coverage/profraw/%m-%p.profraw
              ctest -L quint --output-on-failure --no-tests=error \
                --test-output-size-failed 65536 --timeout 600 -j4
              cp Testing/Temporary/LastTest.log /workspace/quint-diagnostics/full-suite.log
              ctest -C extended -R "^chimera/server/nfs/mbt4/batch_(rdma_)?(cairn|diskfs|memfs)$" \
                --repeat until-fail:5 --output-on-failure --timeout 600 -j4
            '
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-quint-diagnostics
          path: quint-diagnostics/
